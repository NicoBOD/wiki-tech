  <text x="178" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">mardi</text>
  <rect x="130" y="184" width="96" height="38" rx="6" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
  <text x="178" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">mercredi</text>
  <text x="132.0" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Serveur ou support séparé</text>
  <rect x="36" y="284" width="192" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="132.0" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Rançongiciel ou suppression ?</text>
  <text x="132.0" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">On restaure la version</text>
  <text x="132.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">d'avant l'incident.</text>
  <text x="132.0" y="384" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">Plusieurs versions passées, à l'abri.</text>
