  <rect x="278" y="284" width="192" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="374.0" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Fichier supprimé ou chiffré ?</text>
  <text x="374.0" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">Il disparaît ou est chiffré</text>
  <text x="374.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">sur tous les appareils.</text>
  <text x="374.0" y="384" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">Une suppression est recopiée partout.</text>
  <rect x="500" y="16" width="232" height="398" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="616.0" y="46" text-anchor="middle" font-size="17" font-weight="800" fill="#d97706">Réplication</text>
  <text x="616.0" y="68" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">Copie prête à démarrer</text>
  <rect x="518" y="96" width="86" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
