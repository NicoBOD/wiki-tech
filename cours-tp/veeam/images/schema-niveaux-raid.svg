<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="824" viewBox="0 0 1000 824" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Niveaux de RAID 0, 1, 5, 6 et 10</title>
  <desc id="d">Cinq panneaux montrant la répartition des blocs sur les disques. RAID 0 : les blocs A1 à A6 sont répartis sur deux disques, capacité 100 %, aucune panne tolérée. RAID 1 : les mêmes blocs sont écrits sur deux disques, capacité 50 %, une panne tolérée. RAID 5 : données et un bloc de parité P réparti sur trois disques, capacité n moins 1, une panne tolérée. RAID 6 : données et deux blocs de parité P et Q répartis sur quatre disques, capacité n moins 2, deux pannes tolérées. RAID 10 : deux miroirs de deux disques, les blocs étant répartis entre les miroirs, capacité 50 %, une panne tolérée par miroir.</desc>
