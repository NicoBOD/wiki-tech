  <title id="t">Volumes copiés selon le type de sauvegarde</title>
  <desc id="d">Trois graphiques sur une semaine (valeurs en Go), pour un serveur de 900 Go qui change de 100, 200, 100, 300 puis 100 Go du mardi au samedi. Complète chaque jour : chaque sauvegarde copie les 900 Go, soit 5 400 Go au total, restauration en un jeu. Incrémentielle : chaque jour ne copie que ses propres changements, 1 700 Go au total, restauration en six jeux. Différentielle : chaque jour copie tous les changements depuis lundi, 3 200 Go au total, restauration en deux jeux.</desc>
