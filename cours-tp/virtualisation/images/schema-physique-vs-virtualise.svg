<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Trois serveurs physiques consolidés sur un seul serveur virtualisé</title>
  <desc id="d">À gauche, sans virtualisation, trois serveurs physiques exécutent chacun un seul système et une seule application, et n'utilisent qu'environ 15 % de leur processeur. À droite, avec la virtualisation, un seul serveur physique exécute un hyperviseur qui héberge trois machines virtuelles : la messagerie, le serveur de fichiers et l'application métier. Le serveur est utilisé à environ 50 % : 3 fois 15 %, plus un peu pour l'hyperviseur.</desc>
  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/>
  <text x="250" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Sans virtualisation</text>
  <text x="750" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Avec virtualisation</text>
  <line x1="500" y1="20" x2="500" y2="450" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- trois serveurs physiques -->
  <g font-size="14" text-anchor="middle">
    <g>
      <rect x="30" y="70" width="140" height="300" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <rect x="45" y="85" width="110" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="100" y="115" fill="#1e3a8a">Messagerie</text>
      <rect x="45" y="145" width="110" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
      <text x="100" y="170" fill="#312e81">Windows</text>
      <rect x="45" y="195" width="110" height="110" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="100" y="225" fill="#78350f">Matériel</text>
      <text x="100" y="245" fill="#78350f">CPU · RAM</text>
      <text x="100" y="265" fill="#78350f">disque · réseau</text>
      <rect x="45" y="320" width="110" height="18" rx="4" fill="#e2e8f0"/>
      <rect x="45" y="320" width="17" height="18" rx="4" fill="#dc2626"/>
      <text x="100" y="360" fill="#991b1b" font-weight="700">≈ 15 % utilisé</text>
    </g>
    <g>
      <rect x="180" y="70" width="140" height="300" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <rect x="195" y="85" width="110" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="250" y="105" fill="#1e3a8a">Serveur de</text>
      <text x="250" y="123" fill="#1e3a8a">fichiers</text>
      <rect x="195" y="145" width="110" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
      <text x="250" y="170" fill="#312e81">Windows</text>
      <rect x="195" y="195" width="110" height="110" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="250" y="225" fill="#78350f">Matériel</text>
      <text x="250" y="245" fill="#78350f">CPU · RAM</text>
      <text x="250" y="265" fill="#78350f">disque · réseau</text>
      <rect x="195" y="320" width="110" height="18" rx="4" fill="#e2e8f0"/>
      <rect x="195" y="320" width="17" height="18" rx="4" fill="#dc2626"/>
      <text x="250" y="360" fill="#991b1b" font-weight="700">≈ 15 % utilisé</text>
    </g>
    <g>
      <rect x="330" y="70" width="140" height="300" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <rect x="345" y="85" width="110" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="400" y="105" fill="#1e3a8a">Application</text>
      <text x="400" y="123" fill="#1e3a8a">métier</text>
      <rect x="345" y="145" width="110" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="400" y="170" fill="#14532d">Linux</text>
      <rect x="345" y="195" width="110" height="110" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="400" y="225" fill="#78350f">Matériel</text>
      <text x="400" y="245" fill="#78350f">CPU · RAM</text>
      <text x="400" y="265" fill="#78350f">disque · réseau</text>
      <rect x="345" y="320" width="110" height="18" rx="4" fill="#e2e8f0"/>
      <rect x="345" y="320" width="17" height="18" rx="4" fill="#dc2626"/>
      <text x="400" y="360" fill="#991b1b" font-weight="700">≈ 15 % utilisé</text>
    </g>
  </g>
  <text x="250" y="410" text-anchor="middle" font-size="15" fill="#334155">3 serveurs à acheter, alimenter, refroidir et maintenir</text>
  <text x="250" y="432" text-anchor="middle" font-size="15" fill="#334155">Un système = une machine</text>
  <!-- serveur virtualisé -->
  <g font-size="14" text-anchor="middle">
    <rect x="545" y="70" width="410" height="300" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="560" y="85" width="120" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="620" y="102" fill="#2563eb" font-size="12" font-weight="700">VM 1</text>
    <rect x="570" y="110" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="620" y="131" fill="#1e3a8a">Messagerie</text>
    <rect x="570" y="148" width="100" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="620" y="167" fill="#312e81">Windows</text>
    <rect x="690" y="85" width="120" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="750" y="102" fill="#2563eb" font-size="12" font-weight="700">VM 2</text>
    <rect x="700" y="110" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="750" y="131" fill="#1e3a8a">Fichiers</text>
    <rect x="700" y="148" width="100" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="750" y="167" fill="#312e81">Windows</text>
    <rect x="820" y="85" width="120" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="880" y="102" fill="#2563eb" font-size="12" font-weight="700">VM 3</text>
    <rect x="830" y="110" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="880" y="131" fill="#1e3a8a">Appli métier</text>
    <rect x="830" y="148" width="100" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="880" y="167" fill="#14532d">Linux</text>
    <rect x="560" y="195" width="380" height="45" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="750" y="223" fill="#4c1d95" font-weight="700" font-size="16">Hyperviseur : partage les ressources</text>
    <rect x="560" y="250" width="380" height="55" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="750" y="275" fill="#78350f">Un seul matériel</text>
    <text x="750" y="295" fill="#78350f">CPU · RAM · disque · réseau</text>
    <rect x="560" y="320" width="380" height="18" rx="4" fill="#e2e8f0"/>
    <rect x="560" y="320" width="190" height="18" rx="4" fill="#16a34a"/>
    <text x="750" y="360" fill="#166534" font-weight="700">≈ 50 % utilisé</text>
  </g>
  <text x="750" y="410" text-anchor="middle" font-size="15" fill="#334155">1 serveur pour les mêmes services</text>
  <text x="750" y="432" text-anchor="middle" font-size="15" fill="#334155">Chaque VM reste isolée des autres</text>
</svg>
