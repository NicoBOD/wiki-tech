<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Frise chronologique de la virtualisation</title>
  <desc id="d">1967 : IBM CP-40 et CP-67 sur grands systèmes. 1972 : IBM VM/370. 1974 : Popek et Goldberg définissent ce qu'est une architecture virtualisable. 1999 : VMware Workstation sur PC. 2001 : VMware ESX, hyperviseur bare metal pour serveurs x86. 2003 : Xen et la paravirtualisation. 2005 et 2006 : Intel VT-x et AMD-V intègrent la virtualisation dans les processeurs. 2006 : Amazon EC2, début du cloud public. 2007 : KVM entre dans le noyau Linux. 2008 : Microsoft Hyper-V. 2013 : Docker popularise les conteneurs. 2023 : Broadcom rachète VMware.</desc>
  <rect x="0" y="0" width="1000" height="430" rx="16" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Soixante ans de virtualisation</text>
  <line x1="40" y1="215" x2="960" y2="215" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- périodes -->
  <rect x="40" y="200" width="190" height="30" rx="6" fill="#fef3c7"/>
  <text x="135" y="220" text-anchor="middle" font-size="13" fill="#78350f" font-weight="700">Grands systèmes IBM</text>
  <rect x="250" y="200" width="340" height="30" rx="6" fill="#dbeafe"/>
  <text x="420" y="220" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">La virtualisation arrive sur les PC et serveurs x86</text>
  <rect x="610" y="200" width="350" height="30" rx="6" fill="#dcfce7"/>
  <text x="785" y="220" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">Cloud et conteneurs</text>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <!-- au-dessus -->
    <line x1="70" y1="200" x2="70" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <text x="70" y="90" font-weight="700" font-size="16">1967</text>
    <text x="70" y="110">IBM</text>
    <text x="70" y="128">CP-40 / CP-67</text>
    <line x1="190" y1="200" x2="190" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <text x="190" y="90" font-weight="700" font-size="16">1974</text>
    <text x="190" y="110">Popek et Goldberg :</text>
    <text x="190" y="128">règles théoriques</text>
    <line x1="330" y1="200" x2="330" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <text x="330" y="90" font-weight="700" font-size="16">2001</text>
    <text x="330" y="110">VMware ESX</text>
    <text x="330" y="128">(type 1, serveurs)</text>
    <line x1="500" y1="200" x2="500" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="90" font-weight="700" font-size="16">2005 – 2006</text>
    <text x="500" y="110">Intel VT-x, AMD-V :</text>
    <text x="500" y="128">l'aide du processeur</text>
    <line x1="660" y1="200" x2="660" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <text x="660" y="90" font-weight="700" font-size="16">2007</text>
    <text x="660" y="110">KVM dans le</text>
    <text x="660" y="128">noyau Linux</text>
    <line x1="810" y1="200" x2="810" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <text x="810" y="90" font-weight="700" font-size="16">2013</text>
    <text x="810" y="110">Docker</text>
    <text x="810" y="128">popularise les conteneurs</text>
    <!-- en dessous -->
    <line x1="130" y1="230" x2="130" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="130" y="305" font-weight="700" font-size="16">1972</text>
    <text x="130" y="325">IBM VM/370</text>
    <line x1="270" y1="230" x2="270" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="270" y="305" font-weight="700" font-size="16">1999</text>
    <text x="270" y="325">VMware</text>
    <text x="270" y="343">Workstation (type 2)</text>
    <line x1="410" y1="230" x2="410" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="410" y="305" font-weight="700" font-size="16">2003</text>
    <text x="410" y="325">Xen :</text>
    <text x="410" y="343">paravirtualisation</text>
    <line x1="580" y1="230" x2="580" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="580" y="305" font-weight="700" font-size="16">2006</text>
    <text x="580" y="325">Amazon EC2 :</text>
    <text x="580" y="343">le cloud public</text>
    <line x1="730" y1="230" x2="730" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="730" y="305" font-weight="700" font-size="16">2008</text>
    <text x="730" y="325">Microsoft</text>
    <text x="730" y="343">Hyper-V</text>
    <line x1="910" y1="230" x2="910" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="910" y="305" font-weight="700" font-size="16">2023</text>
    <text x="910" y="325">Broadcom</text>
    <text x="910" y="343">rachète VMware</text>
  </g>
  <text x="500" y="400" text-anchor="middle" font-size="14" fill="#475569">L'idée a 60 ans ; elle s'est généralisée quand les processeurs x86 ont intégré la virtualisation (2005-2006).</text>
</svg>
