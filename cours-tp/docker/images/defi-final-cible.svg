<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Le défi final : du navigateur du PC aux trois répliques du service intranet sur le cluster Swarm</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/></marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="250" y="34" font-size="16" font-weight="bold" fill="#263238">Le service intranet : 3 répliques, une par nœud</text>

  <rect x="20" y="170" width="190" height="130" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="115" y="198" text-anchor="middle" font-weight="bold">Navigateur du PC</text>
  <text x="115" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#263238">http://intranet.docker.test</text>
  <text x="115" y="252" text-anchor="middle" font-size="11" fill="#546e7a">fichier hosts :</text>
  <text x="115" y="268" text-anchor="middle" font-size="11" fill="#546e7a">nom → IP-de-la-VM</text>

  <!-- nœuds -->
  <rect x="250" y="56" width="215" height="354" rx="12" fill="#f4f6f8" stroke="#c62828" stroke-width="2"/>
  <text x="265" y="80" font-weight="bold" fill="#b71c1c">docker-hote</text>
  <text x="265" y="97" font-size="11" fill="#546e7a">manager du cluster</text>
  <rect x="485" y="56" width="215" height="354" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="80" font-weight="bold" fill="#1b5e20">docker-n2</text>
  <text x="500" y="97" font-size="11" fill="#546e7a">worker</text>
  <rect x="720" y="56" width="215" height="354" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="735" y="80" font-weight="bold" fill="#1b5e20">docker-n3</text>
  <text x="735" y="97" font-size="11" fill="#546e7a">worker</text>

  <!-- registre -->
  <rect x="265" y="108" width="185" height="62" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="357" y="130" text-anchor="middle" font-weight="bold">registre privé</text>
  <text x="357" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">IP-de-la-VM:5000</text>
  <text x="357" y="163" text-anchor="middle" font-size="11" fill="#546e7a">image intranet:1.0</text>

  <!-- NPM -->
  <rect x="265" y="185" width="185" height="76" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="357" y="208" text-anchor="middle" font-weight="bold">Nginx Proxy Manager</text>
  <text x="357" y="227" text-anchor="middle" font-size="11" fill="#263238">intranet.docker.test</text>
  <text x="357" y="245" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">→ IP-de-la-VM:8085</text>

  <!-- ports 8085 -->
  <rect x="270" y="280" width="175" height="40" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="357" y="298" text-anchor="middle" font-weight="bold">port 8085</text>
  <text x="357" y="313" text-anchor="middle" font-size="10" fill="#546e7a">maillage de routage</text>
  <rect x="505" y="280" width="175" height="40" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="592" y="298" text-anchor="middle" font-weight="bold">port 8085</text>
  <text x="592" y="313" text-anchor="middle" font-size="10" fill="#546e7a">maillage de routage</text>
  <rect x="740" y="280" width="175" height="40" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="827" y="298" text-anchor="middle" font-weight="bold">port 8085</text>
  <text x="827" y="313" text-anchor="middle" font-size="10" fill="#546e7a">maillage de routage</text>
  <line x1="447" y1="300" x2="503" y2="300" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="682" y1="300" x2="738" y2="300" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- répliques -->
  <rect x="270" y="338" width="175" height="58" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="357" y="360" text-anchor="middle" font-weight="bold" fill="#01579b">réplique intranet</text>
  <text x="357" y="378" text-anchor="middle" font-size="11" fill="#263238">limite : 64 Mo</text>
  <rect x="505" y="338" width="175" height="58" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="592" y="360" text-anchor="middle" font-weight="bold" fill="#01579b">réplique intranet</text>
  <text x="592" y="378" text-anchor="middle" font-size="11" fill="#263238">limite : 64 Mo</text>
  <rect x="740" y="338" width="175" height="58" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="827" y="360" text-anchor="middle" font-weight="bold" fill="#01579b">réplique intranet</text>
  <text x="827" y="378" text-anchor="middle" font-size="11" fill="#263238">limite : 64 Mo</text>
  <line x1="357" y1="321" x2="357" y2="336" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="592" y1="321" x2="592" y2="336" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="827" y1="321" x2="827" y2="336" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>

  <text x="592" y="190" text-anchor="middle" font-size="12" fill="#546e7a">exécute les tâches reçues</text>
  <text x="827" y="190" text-anchor="middle" font-size="12" fill="#546e7a">exécute les tâches reçues</text>

  <!-- PC -> NPM, NPM -> 8085 -->
  <line x1="210" y1="223" x2="263" y2="223" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <text x="230" y="214" text-anchor="middle" font-size="11" fill="#263238">:80</text>
  <line x1="357" y1="262" x2="357" y2="278" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>

  <!-- overlay -->
  <line x1="357" y1="396" x2="357" y2="424" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="592" y1="396" x2="592" y2="424" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="827" y1="396" x2="827" y2="424" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="250" y="424" width="685" height="42" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="592" y="450" text-anchor="middle" font-weight="bold" fill="#4527a0">réseau overlay de la pile : relie les 3 répliques</text>

  <text x="250" y="492" font-size="12" fill="#263238"><tspan fill="#f57f17" font-weight="bold">Maillage de routage</tspan> (flèches jaunes) : chaque nœud accepte le port 8085 et transmet la requête à une réplique, où qu'elle soit.</text>
  <text x="250" y="512" font-size="12" fill="#263238">Si un worker tombe, le site doit rester joignable et le service revenir à 3 répliques.</text>
</svg>
