<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Bridge par défaut et bridge personnalisé</title>
  <rect x="10" y="10" width="860" height="360" rx="14" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="30" y="40" font-size="17" font-weight="bold" fill="#1b5e20">VM docker-hote</text>
  <rect x="640" y="25" width="210" height="50" rx="8" fill="#cfd8dc" stroke="#455a64"/>
  <text x="745" y="47" text-anchor="middle" font-weight="bold">carte de la VM (ens33…)</text>
  <text x="745" y="66" text-anchor="middle" font-size="12">NAT vers l'extérieur</text>
  <!-- docker0 -->
  <rect x="40" y="95" width="560" height="44" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="320" y="122" text-anchor="middle" font-weight="bold">bridge par défaut (docker0) 172.17.0.0/16 : pas de noms</text>
  <!-- mon_reseau -->
  <rect x="40" y="300" width="560" height="50" rx="8" fill="#e8f5e9" stroke="#43a047"/>
  <text x="320" y="322" text-anchor="middle" font-weight="bold">mon_reseau — 172.18.0.1/16</text>
  <text x="320" y="341" text-anchor="middle" font-size="12">DNS intégré (127.0.0.11 dans chaque conteneur) : « web2 » → 172.18.0.3</text>
  <!-- conteneurs -->
  <rect x="80" y="180" width="180" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="170" y="210" text-anchor="middle" font-weight="bold" fill="#01579b">web1</text>
  <text x="170" y="232" text-anchor="middle" font-size="12">172.17.0.3 · 172.18.0.2</text>
  <rect x="380" y="180" width="180" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="470" y="210" text-anchor="middle" font-weight="bold" fill="#01579b">web2</text>
  <text x="470" y="232" text-anchor="middle" font-size="12">172.17.0.4 · 172.18.0.3</text>
  <line x1="170" y1="139" x2="170" y2="180" stroke="#f9a825" stroke-width="3"/>
  <line x1="470" y1="139" x2="470" y2="180" stroke="#f9a825" stroke-width="3"/>
  <line x1="170" y1="260" x2="170" y2="300" stroke="#43a047" stroke-width="3"/>
  <line x1="470" y1="260" x2="470" y2="300" stroke="#43a047" stroke-width="3"/>
  <line x1="600" y1="117" x2="700" y2="117" stroke="#455a64" stroke-width="2"/>
  <line x1="700" y1="75" x2="700" y2="117" stroke="#455a64" stroke-width="2"/>
  <line x1="600" y1="325" x2="720" y2="325" stroke="#455a64" stroke-width="2"/>
  <line x1="720" y1="75" x2="720" y2="325" stroke="#455a64" stroke-width="2"/>
  <text x="740" y="200" font-size="12" fill="#546e7a">chaque bridge</text>
  <text x="740" y="218" font-size="12" fill="#546e7a">sort par le NAT</text>
  <text x="740" y="236" font-size="12" fill="#546e7a">de la VM</text>
</svg>
