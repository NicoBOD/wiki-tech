<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Le nom d'une image : registre, espace, dépôt, étiquette, puis tag, push et pull</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#263238">Lire le nom d'une image comme une adresse postale</text>
  <text x="940" y="28" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#263238">registre / espace / dépôt : étiquette</text>

  <!-- en-têtes -->
  <rect x="306" y="42" width="160" height="58" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="386" y="64" text-anchor="middle" font-weight="bold">registre</text>
  <text x="386" y="84" text-anchor="middle" font-size="11" fill="#546e7a">omis : docker.io</text>
  <rect x="482" y="42" width="140" height="58" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="552" y="64" text-anchor="middle" font-weight="bold">espace</text>
  <text x="552" y="84" text-anchor="middle" font-size="11" fill="#546e7a">omis : library</text>
  <rect x="638" y="42" width="160" height="58" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="718" y="64" text-anchor="middle" font-weight="bold">dépôt</text>
  <text x="718" y="84" text-anchor="middle" font-size="11" fill="#546e7a">obligatoire</text>
  <rect x="814" y="42" width="106" height="58" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="867" y="64" text-anchor="middle" font-weight="bold">étiquette</text>
  <text x="867" y="84" text-anchor="middle" font-size="11" fill="#546e7a">omis : latest</text>
  <text x="474" y="76" text-anchor="middle" font-size="16" fill="#546e7a">/</text>
  <text x="630" y="76" text-anchor="middle" font-size="16" fill="#546e7a">/</text>
  <text x="806" y="76" text-anchor="middle" font-size="16" fill="#546e7a">:</text>
  <text x="20" y="76" font-size="12" font-weight="bold" fill="#546e7a">Ce qu'on écrit :</text>

  <!-- ligne A -->
  <text x="20" y="132" font-weight="bold" font-size="13">Docker Hub, implicite</text>
  <text x="20" y="150" font-family="Consolas, monospace" font-size="12" fill="#263238">nginx</text>
  <rect x="306" y="120" width="160" height="40" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <text x="386" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#757575">docker.io</text>
  <rect x="482" y="120" width="140" height="40" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <text x="552" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#757575">library</text>
  <rect x="638" y="120" width="160" height="40" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="718" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#01579b">nginx</text>
  <rect x="814" y="120" width="106" height="40" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <text x="867" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#757575">latest</text>

  <!-- ligne B -->
  <text x="20" y="192" font-weight="bold" font-size="13">Compte Docker Hub</text>
  <text x="20" y="210" font-family="Consolas, monospace" font-size="10.5" fill="#263238">&lt;identifiant&gt;/initiation-docker:tagname</text>
  <rect x="306" y="180" width="160" height="40" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <text x="386" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#757575">docker.io</text>
  <rect x="482" y="180" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="552" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#1b5e20">&lt;identifiant&gt;</text>
  <rect x="638" y="180" width="160" height="40" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="718" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#01579b">initiation-docker</text>
  <rect x="814" y="180" width="106" height="40" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="867" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#4527a0">tagname</text>

  <!-- ligne C -->
  <text x="20" y="252" font-weight="bold" font-size="13">Registre privé du lab</text>
  <text x="20" y="270" font-family="Consolas, monospace" font-size="11" fill="#263238">192.168.8.71:5000/web:1.0</text>
  <rect x="306" y="240" width="160" height="40" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="386" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#8d6e00">192.168.8.71:5000</text>
  <rect x="482" y="240" width="140" height="40" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <text x="552" y="265" text-anchor="middle" font-size="12" fill="#757575">pas d'espace</text>
  <rect x="638" y="240" width="160" height="40" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="718" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#01579b">web</text>
  <rect x="814" y="240" width="106" height="40" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="867" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4527a0">1.0</text>
  <text x="20" y="302" font-size="12" fill="#546e7a">Les cases en pointillé gris sont écrites par Docker à votre place : docker pull nginx télécharge docker.io/library/nginx:latest.</text>

  <!-- flux -->
  <line x1="20" y1="322" x2="940" y2="322" stroke="#cfd8dc"/>
  <text x="20" y="348" font-size="16" font-weight="bold" fill="#263238">Envoyer une image : lui donner un nom qui contient la bonne adresse</text>

  <rect x="20" y="372" width="200" height="170" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="120" y="396" text-anchor="middle" font-weight="bold" fill="#1b5e20">VM docker-hote</text>
  <rect x="35" y="410" width="170" height="30" rx="8" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="120" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#263238">web</text>
  <line x1="120" y1="440" x2="120" y2="456" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <text x="130" y="454" font-family="Consolas, monospace" font-size="10" fill="#263238">docker tag</text>
  <rect x="35" y="458" width="170" height="30" rx="8" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="120" y="478" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">localhost:5000/web:1.0</text>
  <text x="120" y="508" text-anchor="middle" font-size="11" fill="#546e7a">même image, deux noms :</text>
  <text x="120" y="524" text-anchor="middle" font-size="11" fill="#546e7a">rien n'est copié</text>

  <rect x="380" y="372" width="200" height="170" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="480" y="396" text-anchor="middle" font-weight="bold" fill="#8d6e00">Registre privé</text>
  <text x="480" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#263238">IP-de-la-VM:5000</text>
  <text x="480" y="456" text-anchor="middle" font-size="12">sur docker-hote,</text>
  <text x="480" y="474" text-anchor="middle" font-size="12">port 5000</text>
  <text x="480" y="508" text-anchor="middle" font-size="11" fill="#546e7a">stocke et distribue</text>
  <text x="480" y="524" text-anchor="middle" font-size="11" fill="#546e7a">les images</text>

  <rect x="740" y="372" width="200" height="170" rx="12" fill="#f4f6f8" stroke="#607d8b" stroke-width="2"/>
  <text x="840" y="396" text-anchor="middle" font-weight="bold" fill="#37474f">Autre machine</text>
  <rect x="750" y="458" width="180" height="30" rx="8" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="840" y="478" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#263238">IP-de-la-VM:5000/web:1.0</text>
  <text x="840" y="416" text-anchor="middle" font-size="11" fill="#546e7a">le registre est déclaré dans</text>
  <text x="840" y="432" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#263238">insecure-registries</text>
  <text x="840" y="508" text-anchor="middle" font-size="11" fill="#546e7a">(HTTP, pour un lab)</text>

  <line x1="222" y1="473" x2="378" y2="473" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <text x="300" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#263238">docker push</text>
  <text x="300" y="462" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#263238">localhost:5000/web:1.0</text>
  <line x1="582" y1="473" x2="738" y2="473" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <text x="660" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#263238">docker pull</text>
  <text x="660" y="462" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#263238">IP-de-la-VM:5000/web:1.0</text>
</svg>
