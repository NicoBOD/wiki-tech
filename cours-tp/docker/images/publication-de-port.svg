<svg xmlns="http://www.w3.org/2000/svg" width="860" height="275" viewBox="0 0 860 275" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Publication d'un port : -p 8080:80</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect x="20" y="70" width="170" height="90" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="105" y="100" text-anchor="middle" font-weight="bold">🌐 Navigateur du PC</text>
  <text x="105" y="126" text-anchor="middle" font-size="13">http://192.168.x.130:8080</text>
  <rect x="260" y="30" width="580" height="190" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="280" y="56" font-weight="bold" fill="#1b5e20">VM docker-hote — adresse 192.168.x.130</text>
  <rect x="290" y="80" width="150" height="70" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="365" y="108" text-anchor="middle" font-weight="bold">port 8080</text>
  <text x="365" y="130" text-anchor="middle" font-size="12">ouvert par Docker</text>
  <rect x="510" y="70" width="300" height="130" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="660" y="98" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur web — 172.17.0.2</text>
  <rect x="600" y="115" width="120" height="60" rx="8" fill="#ffffff" stroke="#0288d1"/>
  <text x="660" y="140" text-anchor="middle" font-weight="bold">port 80</text>
  <text x="660" y="160" text-anchor="middle" font-size="12">nginx écoute ici</text>
  <line x1="190" y1="115" x2="288" y2="115" stroke="#1565c0" stroke-width="3" marker-end="url(#g)"/>
  <line x1="440" y1="115" x2="598" y2="140" stroke="#1565c0" stroke-width="3" marker-end="url(#g)"/>
  <text x="520" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#263238">docker run -d --name web -p <tspan fill="#f57f17" font-weight="bold">8080</tspan>:<tspan fill="#0277bd" font-weight="bold">80</tspan> nginx</text>
  <text x="365" y="185" text-anchor="middle" font-size="12" fill="#546e7a">port de la VM (hôte)</text>
  <text x="660" y="190" text-anchor="middle" font-size="12" fill="#546e7a">port du conteneur</text>
</svg>
