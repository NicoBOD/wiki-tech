<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Open WebUI dans la VM joint Ollama du PC par un tunnel SSH inverse</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <rect x="20" y="20" width="240" height="370" rx="14" fill="#f4f6f8" stroke="#607d8b" stroke-width="2"/>
  <text x="40" y="46" font-size="16" font-weight="bold" fill="#37474f">PC hôte</text>
  <rect x="40" y="90" width="200" height="100" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-weight="bold" fill="#1b5e20">Ollama</text>
  <text x="140" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#263238">127.0.0.1:11434</text>
  <text x="140" y="162" text-anchor="middle" font-size="11" fill="#546e7a">fermé au réseau</text>
  <text x="140" y="178" text-anchor="middle" font-size="11" fill="#546e7a">les modèles tournent ici</text>
  <rect x="40" y="270" width="200" height="90" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="140" y="298" text-anchor="middle" font-weight="bold">Navigateur du PC</text>
  <text x="140" y="324" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">http://IP-de-la-VM:3000</text>

  <rect x="400" y="20" width="540" height="370" rx="14" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="420" y="46" font-size="16" font-weight="bold" fill="#1b5e20">VM docker-hote</text>
  <rect x="425" y="90" width="190" height="100" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="520" y="118" text-anchor="middle" font-weight="bold" fill="#4527a0">port de la VM</text>
  <text x="520" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#263238">127.0.0.1:11434</text>
  <text x="520" y="162" text-anchor="middle" font-size="11" fill="#546e7a">joignable seulement</text>
  <text x="520" y="178" text-anchor="middle" font-size="11" fill="#546e7a">depuis la VM elle-même</text>

  <rect x="670" y="90" width="250" height="270" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="795" y="116" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur open-webui</text>
  <text x="795" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#263238">--network host</text>
  <text x="795" y="157" text-anchor="middle" font-size="11" fill="#546e7a">il partage le réseau de la VM</text>
  <rect x="685" y="172" width="220" height="62" rx="8" fill="#ffffff" stroke="#0288d1"/>
  <text x="795" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">OLLAMA_BASE_URL=</text>
  <text x="795" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">http://127.0.0.1:11434</text>
  <rect x="685" y="290" width="220" height="56" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="795" y="314" text-anchor="middle" font-weight="bold">port 3000</text>
  <text x="795" y="333" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">PORT=3000</text>

  <line x1="668" y1="140" x2="617" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="423" y1="140" x2="242" y2="140" stroke="#5e35b1" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#p)"/>
  <text x="332" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527a0">tunnel SSH inverse</text>
  <text x="332" y="130" text-anchor="middle" font-size="11" fill="#4527a0">créé depuis le PC</text>
  <text x="332" y="170" text-anchor="middle" font-size="11" fill="#546e7a">fenêtre à laisser ouverte</text>

  <line x1="242" y1="318" x2="683" y2="318" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <text x="440" y="308" text-anchor="middle" font-size="12" fill="#263238">le navigateur ouvre Open WebUI</text>

  <rect x="20" y="410" width="920" height="80" rx="12" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="480" y="436" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#263238">ssh -N -R 127.0.0.1:11434:127.0.0.1:11434 adminlab@IP-de-la-VM</text>
  <text x="480" y="460" text-anchor="middle" font-size="12" fill="#263238"><tspan font-weight="bold">-R</tspan> : ouvre sur la VM un port 11434, réservé à la VM (127.0.0.1), qui mène au port 11434 du PC où écoute Ollama.</text>
  <text x="480" y="478" text-anchor="middle" font-size="12" fill="#263238"><tspan font-weight="bold">-N</tspan> : pas de terminal, seulement le tunnel.</text>
</svg>
