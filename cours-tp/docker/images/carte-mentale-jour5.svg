<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>Jour 5 — Construire, distribuer, orchestrer : carte mentale de révision</title>
  <rect x="0" y="0" width="1200" height="844" fill="#ffffff"/>
  <path d="M600,422 C460,422 470,50 420,50" fill="none" stroke="#1565c0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M600,422 C460,422 470,330 420,330" fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M600,422 C460,422 470,610 420,610" fill="none" stroke="#ef6c00" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M600,422 C740,422 730,101 780,101" fill="none" stroke="#6a1b9a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M600,422 C740,422 730,347 780,347" fill="none" stroke="#00838f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M600,422 C740,422 730,559 780,559" fill="none" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="20" y="30" width="400" height="258" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="36" y="55" font-size="16" font-weight="bold" fill="#1565c0">14 Construire avec un Dockerfile</text>
  <rect x="34" y="78" width="372" height="28" rx="6" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.55"/>
  <text x="44" y="96" fill="#263238">FROM, RUN, COPY, ENV, ARG, USER</text>
  <rect x="34" y="112" width="372" height="28" rx="6" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.55"/>
  <text x="44" y="130" fill="#263238">CMD : commande ou arguments par défaut</text>
  <rect x="34" y="146" width="372" height="28" rx="6" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.55"/>
  <text x="44" y="164" fill="#263238">ENTRYPOINT : le programme principal</text>
  <rect x="34" y="180" width="372" height="28" rx="6" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.55"/>
  <text x="44" y="198" fill="#263238">EXPOSE ne publie rien</text>
  <rect x="34" y="214" width="372" height="28" rx="6" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.55"/>
  <text x="44" y="232" font-family="Consolas, monospace" font-size="12" fill="#263238">docker build -t web .</text>
  <rect x="34" y="248" width="372" height="28" rx="6" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.55"/>
  <text x="44" y="266" font-family="Consolas, monospace" font-size="12" fill="#263238">docker history web  (couches et cache)</text>
  <rect x="20" y="310" width="400" height="258" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="36" y="335" font-size="16" font-weight="bold" fill="#2e7d32">15 Distribuer : le registre</text>
  <rect x="34" y="358" width="372" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.55"/>
  <text x="44" y="376" font-family="Consolas, monospace" font-size="12" fill="#263238">docker tag web localhost:5000/web:1.0</text>
  <rect x="34" y="392" width="372" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.55"/>
  <text x="44" y="410" font-family="Consolas, monospace" font-size="12" fill="#263238">docker push localhost:5000/web:1.0</text>
  <rect x="34" y="426" width="372" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.55"/>
  <text x="44" y="444" font-family="Consolas, monospace" font-size="12" fill="#263238">docker run -d -p 5000:5000 registry:3</text>
  <rect x="34" y="460" width="372" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.55"/>
  <text x="44" y="478" font-family="Consolas, monospace" font-size="12" fill="#263238">docker login -u &lt;identifiant&gt;</text>
  <rect x="34" y="494" width="372" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.55"/>
  <text x="44" y="512" fill="#263238">Autre machine : insecure-registries</text>
  <rect x="34" y="528" width="372" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.55"/>
  <text x="44" y="546" fill="#263238">Étiquettes précises, pas seulement latest</text>
  <rect x="20" y="590" width="400" height="224" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="36" y="615" font-size="16" font-weight="bold" fill="#ef6c00">16 Créer le cluster Swarm</text>
  <rect x="34" y="638" width="372" height="28" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-opacity="0.55"/>
  <text x="44" y="656" font-family="Consolas, monospace" font-size="12" fill="#263238">docker swarm init --advertise-addr IP</text>
  <rect x="34" y="672" width="372" height="28" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-opacity="0.55"/>
  <text x="44" y="690" font-family="Consolas, monospace" font-size="12" fill="#263238">docker swarm join --token ... IP:2377</text>
  <rect x="34" y="706" width="372" height="28" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-opacity="0.55"/>
  <text x="44" y="724" font-family="Consolas, monospace" font-size="12" fill="#263238">docker node ls</text>
  <rect x="34" y="740" width="372" height="28" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-opacity="0.55"/>
  <text x="44" y="758" fill="#263238">Managers décident à la majorité (Raft)</text>
  <rect x="34" y="774" width="372" height="28" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-opacity="0.55"/>
  <text x="44" y="792" fill="#263238">Production : 3 managers, nombre impair</text>
  <rect x="780" y="81" width="400" height="224" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="796" y="106" font-size="16" font-weight="bold" fill="#6a1b9a">16 Services et pannes</text>
  <rect x="794" y="129" width="372" height="28" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-opacity="0.55"/>
  <text x="804" y="147" font-family="Consolas, monospace" font-size="12" fill="#263238">docker service create --replicas 3 -p 8080:80</text>
  <rect x="794" y="163" width="372" height="28" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-opacity="0.55"/>
  <text x="804" y="181" font-family="Consolas, monospace" font-size="12" fill="#263238">docker service ps bonjour</text>
  <rect x="794" y="197" width="372" height="28" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-opacity="0.55"/>
  <text x="804" y="215" fill="#263238">Maillage de routage : port sur tous les nœuds</text>
  <rect x="794" y="231" width="372" height="28" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-opacity="0.55"/>
  <text x="804" y="249" fill="#263238">Nœud en panne : répliques recréées ailleurs</text>
  <rect x="794" y="265" width="372" height="28" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-opacity="0.55"/>
  <text x="804" y="283" font-family="Consolas, monospace" font-size="12" fill="#263238">docker node update --availability drain</text>
  <rect x="780" y="327" width="400" height="190" rx="12" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="796" y="352" font-size="16" font-weight="bold" fill="#00838f">16 Évoluer et empiler</text>
  <rect x="794" y="375" width="372" height="28" rx="6" fill="#ffffff" stroke="#00838f" stroke-opacity="0.55"/>
  <text x="804" y="393" font-family="Consolas, monospace" font-size="12" fill="#263238">docker service update --update-delay 5s</text>
  <rect x="794" y="409" width="372" height="28" rx="6" fill="#ffffff" stroke="#00838f" stroke-opacity="0.55"/>
  <text x="804" y="427" font-family="Consolas, monospace" font-size="12" fill="#263238">docker service rollback bonjour</text>
  <rect x="794" y="443" width="372" height="28" rx="6" fill="#ffffff" stroke="#00838f" stroke-opacity="0.55"/>
  <text x="804" y="461" font-family="Consolas, monospace" font-size="12" fill="#263238">docker network create -d overlay --attachable</text>
  <rect x="794" y="477" width="372" height="28" rx="6" fill="#ffffff" stroke="#00838f" stroke-opacity="0.55"/>
  <text x="804" y="495" font-family="Consolas, monospace" font-size="12" fill="#263238">docker stack deploy -c compose.yaml demo</text>
  <rect x="780" y="539" width="400" height="224" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="796" y="564" font-size="16" font-weight="bold" fill="#c62828">17 Défi final</text>
  <rect x="794" y="587" width="372" height="28" rx="6" fill="#ffffff" stroke="#c62828" stroke-opacity="0.55"/>
  <text x="804" y="605" fill="#263238">Image avec HEALTHCHECK, rangée au registre</text>
  <rect x="794" y="621" width="372" height="28" rx="6" fill="#ffffff" stroke="#c62828" stroke-opacity="0.55"/>
  <text x="804" y="639" fill="#263238">Pile : 3 répliques, port 8085, overlay</text>
  <rect x="794" y="655" width="372" height="28" rx="6" fill="#ffffff" stroke="#c62828" stroke-opacity="0.55"/>
  <text x="804" y="673" fill="#263238">Limite de 64 Mo, restart_policy: any</text>
  <rect x="794" y="689" width="372" height="28" rx="6" fill="#ffffff" stroke="#c62828" stroke-opacity="0.55"/>
  <text x="804" y="707" fill="#263238">Publié derrière NPM : intranet.docker.test</text>
  <rect x="794" y="723" width="372" height="28" rx="6" fill="#ffffff" stroke="#c62828" stroke-opacity="0.55"/>
  <text x="804" y="741" font-family="Consolas, monospace" font-size="12" fill="#263238">docker service ps ... --no-trunc  (ERROR)</text>
  <ellipse cx="600" cy="422" rx="135" ry="62" fill="#f4f6f8" stroke="#37474f" stroke-width="3"/>
  <text x="600" y="416" text-anchor="middle" font-size="26" font-weight="bold" fill="#263238">Jour 5</text>
  <text x="600" y="436" text-anchor="middle" font-size="14" fill="#37474f">Construire,</text>
  <text x="600" y="453" text-anchor="middle" font-size="14" fill="#37474f">distribuer, orchestrer</text>
</svg>
