<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Machines virtuelles et conteneurs : ce qui est copié et ce qui est partagé</title>
  <text x="210" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#263238">Trois machines virtuelles</text>
  <text x="650" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#263238">Trois conteneurs</text>
  <!-- VM side -->
  <g>
    <rect x="20" y="50" width="120" height="44" rx="6" fill="#e1f5fe" stroke="#0288d1"/><text x="80" y="77" text-anchor="middle">Application A</text>
    <rect x="150" y="50" width="120" height="44" rx="6" fill="#e1f5fe" stroke="#0288d1"/><text x="210" y="77" text-anchor="middle">Application B</text>
    <rect x="280" y="50" width="120" height="44" rx="6" fill="#e1f5fe" stroke="#0288d1"/><text x="340" y="77" text-anchor="middle">Application C</text>
    <rect x="20" y="100" width="120" height="44" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="80" y="127" text-anchor="middle">Bibliothèques</text>
    <rect x="150" y="100" width="120" height="44" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="210" y="127" text-anchor="middle">Bibliothèques</text>
    <rect x="280" y="100" width="120" height="44" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="340" y="127" text-anchor="middle">Bibliothèques</text>
    <rect x="20" y="150" width="120" height="58" rx="6" fill="#ffebee" stroke="#e53935"/><text x="80" y="174" text-anchor="middle">Système invité</text><text x="80" y="195" text-anchor="middle" font-size="11">(noyau + système)</text>
    <rect x="150" y="150" width="120" height="58" rx="6" fill="#ffebee" stroke="#e53935"/><text x="210" y="174" text-anchor="middle">Système invité</text><text x="210" y="195" text-anchor="middle" font-size="11">(noyau + système)</text>
    <rect x="280" y="150" width="120" height="58" rx="6" fill="#ffebee" stroke="#e53935"/><text x="340" y="174" text-anchor="middle">Système invité</text><text x="340" y="195" text-anchor="middle" font-size="11">(noyau + système)</text>
    <rect x="20" y="220" width="380" height="44" rx="6" fill="#fff8e1" stroke="#f9a825"/><text x="210" y="247" text-anchor="middle" font-weight="bold">Hyperviseur</text>
    <rect x="20" y="270" width="380" height="44" rx="6" fill="#eceff1" stroke="#607d8b"/><text x="210" y="297" text-anchor="middle">Système hôte (ou rien, pour un hyperviseur de type 1)</text>
    <rect x="20" y="320" width="380" height="44" rx="6" fill="#cfd8dc" stroke="#455a64"/><text x="210" y="347" text-anchor="middle" font-weight="bold">Matériel</text>
  </g>
  <line x1="430" y1="45" x2="430" y2="370" stroke="#b0bec5" stroke-dasharray="6 6"/>
  <!-- Container side -->
  <g>
    <rect x="460" y="100" width="120" height="44" rx="6" fill="#e1f5fe" stroke="#0288d1"/><text x="520" y="127" text-anchor="middle">Application A</text>
    <rect x="590" y="100" width="120" height="44" rx="6" fill="#e1f5fe" stroke="#0288d1"/><text x="650" y="127" text-anchor="middle">Application B</text>
    <rect x="720" y="100" width="120" height="44" rx="6" fill="#e1f5fe" stroke="#0288d1"/><text x="780" y="127" text-anchor="middle">Application C</text>
    <rect x="460" y="150" width="120" height="58" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="520" y="174" text-anchor="middle">Bibliothèques</text><text x="520" y="195" text-anchor="middle" font-size="12">(sans noyau)</text>
    <rect x="590" y="150" width="120" height="58" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="650" y="174" text-anchor="middle">Bibliothèques</text><text x="650" y="195" text-anchor="middle" font-size="12">(sans noyau)</text>
    <rect x="720" y="150" width="120" height="58" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="780" y="174" text-anchor="middle">Bibliothèques</text><text x="780" y="195" text-anchor="middle" font-size="12">(sans noyau)</text>
    <rect x="460" y="220" width="380" height="44" rx="6" fill="#e8f5e9" stroke="#43a047"/><text x="650" y="247" text-anchor="middle" font-weight="bold">Docker Engine</text>
    <rect x="460" y="270" width="380" height="44" rx="6" fill="#eceff1" stroke="#607d8b"/><text x="650" y="297" text-anchor="middle">Système hôte Linux : <tspan font-weight="bold">un seul noyau, partagé</tspan></text>
    <rect x="460" y="320" width="380" height="44" rx="6" fill="#cfd8dc" stroke="#455a64"/><text x="650" y="347" text-anchor="middle" font-weight="bold">Matériel (ou une VM !)</text>
  </g>
  <text x="430" y="392" text-anchor="middle" font-size="13" fill="#455a64">En rouge : ce que chaque VM copie et que les conteneurs n'ont pas besoin de copier.</text>
</svg>
