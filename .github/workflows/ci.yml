name: Validation build

# Vérifie que le site se construit sans erreur AVANT d'arriver sur main.
# Le build --strict échoue sur les liens internes cassés, les références
# manquantes et les avertissements de configuration.
on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Version épinglée pour des builds reproductibles (cf. requirements.txt)
          python-version: '3.12'
          # Cache des paquets pip basé sur requirements.txt
          cache: 'pip'

      - name: Installer les dépendances système d'imagerie
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      # Cache des social cards (plugin social) et des images compressées
      # (plugin optimize) pour éviter de tout régénérer à chaque run.
      - name: Cache MkDocs (.cache)
        uses: actions/cache@v6
        with:
          path: .cache
          key: mkdocs-cache-${{ hashFiles('docs/**', 'mkdocs.yml') }}
          restore-keys: |
            mkdocs-cache-

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict
