name: Deploy Wiki

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Un seul déploiement à la fois : deux push rapprochés sur main ne se
# télescopent pas sur la branche gh-pages.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Historique complet requis par git-revision-date-localized
          # pour calculer la date de dernière mise à jour de chaque page.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Version épinglée pour des builds reproductibles (cf. requirements.txt)
          python-version: '3.12'
          # Cache des paquets pip basé sur requirements.txt
          cache: 'pip'

      # Bibliothèques système pour les social cards (plugin social →
      # cairosvg / pillow) et la compression d'images (optimize → pngquant).
      - name: Installer les dépendances système d'imagerie
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      # Cache des social cards (plugin social) et des images compressées
      # (plugin optimize) pour accélérer les déploiements successifs.
      - name: Cache MkDocs (.cache)
        uses: actions/cache@v6
        with:
          path: .cache
          key: mkdocs-cache-${{ hashFiles('docs/**', 'mkdocs.yml') }}
          restore-keys: |
            mkdocs-cache-

      - run: pip install -r requirements.txt

      - run: mkdocs gh-deploy --force
