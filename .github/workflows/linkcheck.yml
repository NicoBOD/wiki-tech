name: Vérification des liens

# Contrôle périodique des liens (internes et externes) des notes.
# Workflow SÉPARÉ et planifié : il ne bloque jamais un déploiement.
# En cas de liens morts, une issue est créée / mise à jour automatiquement.
on:
  schedule:
    - cron: '0 6 * * 1'  # tous les lundis à 06:00 UTC
  workflow_dispatch:       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: read
  issues: write

# Évite deux vérifications simultanées (planifiée + manuelle).
concurrency:
  group: linkcheck
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vérifier les liens
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # On accepte 403, 429 et 999 : de nombreux sites (dont LinkedIn)
          # renvoient ces codes aux robots ou en cas de limite de débit sans
          # que le lien soit mort.
          # --exclude-all-private : ignore les IP privées/loopback utilisées
          # volontairement comme exemples dans certains tutoriels (ex: Vagrant).
          # --exclude gnu.org : le serveur de la FSF bloque/limite les requêtes
          # depuis les runners GitHub Actions (timeouts systématiques), alors
          # que les pages sont bien accessibles pour un humain.
          # --exclude pkgs/container : les pages web GitHub Packages
          # (github.com/<owner>/<repo>/pkgs/container/…, qui présentent les
          # images publiées sur ghcr.io) renvoient parfois 502 aux requêtes
          # automatisées des runners CI (cf. issues #28, #31), alors qu'elles
          # sont bien accessibles pour un humain.
          # --exclude aka.ms : le raccourcisseur d'URL de Microsoft répond 301
          # vers des pages de compte (ex. aka.ms/myrecoverykey ->
          # account.microsoft.com/devices/recoverykey) qui exigent une
          # authentification et coupent la connexion des clients automatisés :
          # invérifiable en CI, valide pour un humain (cf. issues #41, #43).
          # --exclude chiark.greenend.org.uk : le serveur qui héberge la
          # documentation de PuTTY met systématiquement 12 à 14 s à répondre et
          # coupe une requête sur deux (connexion réinitialisée), ce qui déclenche
          # des timeouts en CI (cf. issue #43) ; la page reste accessible pour un
          # humain, même principe que l'exclusion gnu.org ci-dessus.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200..=299,403,429,999
            --exclude-all-private
            --exclude 'gnu\.org'
            --exclude 'github\.com/[^/]+/[^/]+/pkgs/container/'
            --exclude 'aka\.ms'
            --exclude 'chiark\.greenend\.org\.uk'
            'docs/**/*.md'
            'README.md'
          # N'échoue pas le job : le résultat est remonté via une issue.
          fail: false

      - name: Ouvrir / mettre à jour une issue si des liens sont cassés
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "🔗 Liens cassés détectés par lychee"
          content-filepath: ./lychee/out.md
          labels: maintenance, liens-cassés
