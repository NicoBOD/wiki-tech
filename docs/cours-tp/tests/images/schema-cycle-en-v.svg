<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Le cycle en V</title>
  <desc id="d">Branche descendante à gauche : expression du besoin, spécifications, conception générale, conception détaillée. En bas : codage. Branche montante à droite : tests unitaires, tests d'intégration, tests système, tests d'acceptation (recette). Des flèches horizontales relient chaque étape de conception au test qui la vérifie.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="440" rx="16" fill="#ffffff"/>
  <rect x="12" y="12" width="836" height="416" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Concevoir (on descend)</text>
  <text x="660" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Tester (on remonte)</text>
  <!-- gauche -->
  <g font-size="14" fill="#1e293b" text-anchor="middle">
    <rect x="40" y="60" width="240" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="88">Expression du besoin</text>
    <rect x="90" y="140" width="240" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="168">Spécifications</text>
    <rect x="140" y="220" width="240" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="260" y="248">Conception générale</text>
    <rect x="190" y="300" width="220" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="328">Conception détaillée</text>
    <rect x="345" y="370" width="170" height="44" rx="8" fill="#1e3a8a"/>
    <text x="430" y="397" fill="#ffffff" font-weight="700">Codage</text>
    <!-- droite -->
    <rect x="450" y="300" width="220" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="560" y="328">Tests unitaires</text>
    <rect x="480" y="220" width="240" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="248">Tests d'intégration</text>
    <rect x="530" y="140" width="240" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="650" y="168">Tests système</text>
    <rect x="580" y="60" width="240" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="88">Tests d'acceptation (recette)</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="282" y1="83" x2="576" y2="83" marker-end="url(#flv)"/>
    <line x1="332" y1="163" x2="526" y2="163" marker-end="url(#flv)"/>
    <line x1="382" y1="243" x2="476" y2="243" marker-end="url(#flv)"/>
    <line x1="412" y1="323" x2="446" y2="323" marker-end="url(#flv)"/>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="160" y1="106" x2="200" y2="138" marker-end="url(#fl)"/>
    <line x1="210" y1="186" x2="250" y2="218" marker-end="url(#fl)"/>
    <line x1="260" y1="266" x2="300" y2="298" marker-end="url(#fl)"/>
    <line x1="330" y1="346" x2="370" y2="368" marker-end="url(#fl)"/>
    <line x1="490" y1="368" x2="530" y2="348" marker-end="url(#fl)"/>
    <line x1="560" y1="300" x2="590" y2="268" marker-end="url(#fl)"/>
    <line x1="610" y1="220" x2="640" y2="188" marker-end="url(#fl)"/>
    <line x1="660" y1="140" x2="690" y2="108" marker-end="url(#fl)"/>
  </g>
  <text x="430" y="76" text-anchor="middle" font-size="12" fill="#15803d">vérifie</text>
  <text x="430" y="156" text-anchor="middle" font-size="12" fill="#15803d">vérifie</text>
</svg>
