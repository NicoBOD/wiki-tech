<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Lab du jour 2</title>
  <desc id="d">Sur le PC hôte, Workstation fournit deux réseaux. VMnet8 en NAT, 192.168.x.0/24, donne Internet ; y sont branchés web2 et web3, et la première carte du routeur. VMnet2, réseau privé hôte isolé, 10.10.10.0/24, sans DHCP et sans carte du PC, relie la seconde carte du routeur en 10.10.10.1, le serveur web1 en 10.10.10.10 et le serveur de stockage en 10.10.10.20. Le routeur fait la traduction d'adresses pour que web1 et stockage sortent sur Internet. Le serveur de stockage partage un dossier en NFS et un disque de 10 Go en iSCSI à web1.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/>
  <ellipse cx="880" cy="55" rx="85" ry="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="880" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">Internet</text>
  <rect x="30" y="20" width="760" height="430" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="50" y="50" font-size="17" font-weight="700" fill="#0f172a">🖥️ PC hôte — VMware Workstation Pro</text>
  <line x1="790" y1="85" x2="805" y2="70" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
  <!-- VMnet8 -->
  <rect x="50" y="70" width="720" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="94" font-size="15" font-weight="700" fill="#14532d">VMnet8 — NAT — 192.168.x.0/24</text>
  <text x="70" y="114" font-size="13" fill="#166534">passerelle et DNS .2 · DHCP .128 à .253 · PC .1</text>
  <g font-size="14" text-anchor="middle">
    <line x1="560" y1="126" x2="560" y2="160" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="680" y1="126" x2="680" y2="160" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="505" y="160" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="560" y="185" font-weight="700" fill="#1e3a8a">web2</text>
    <text x="560" y="205" fill="#1e3a8a" font-size="12">DHCP · partie 5</text>
    <rect x="625" y="160" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="680" y="185" font-weight="700" fill="#1e3a8a">web3</text>
    <text x="680" y="205" fill="#1e3a8a" font-size="12">DHCP · partie 5</text>
    <!-- routeur -->
    <line x1="160" y1="126" x2="160" y2="160" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="70" y="160" width="300" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="220" y="186" font-weight="700" fill="#78350f">routeur (Debian)</text>
    <text x="220" y="208" fill="#78350f" font-size="13">ens33 : DHCP sur VMnet8</text>
    <text x="220" y="228" fill="#78350f" font-size="13">2e carte : 10.10.10.1 · NAT nftables</text>
    <line x1="220" y1="250" x2="220" y2="290" stroke="#7c3aed" stroke-width="2.5"/>
  </g>
  <!-- VMnet2 -->
  <rect x="50" y="290" width="720" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="70" y="314" font-size="15" font-weight="700" fill="#4c1d95">VMnet2 — réseau isolé — 10.10.10.0/24</text>
  <text x="70" y="332" font-size="13" fill="#5b21b6">sans DHCP, sans carte du PC : invisible depuis Windows</text>
  <g font-size="14" text-anchor="middle">
    <line x1="300" y1="340" x2="300" y2="370" stroke="#7c3aed" stroke-width="2.5"/>
    <line x1="560" y1="340" x2="560" y2="370" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="200" y="370" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="395" font-weight="700" fill="#1e3a8a">web1 · 10.10.10.10</text>
    <text x="300" y="415" fill="#1e3a8a" font-size="12">client NFS et iSCSI</text>
    <rect x="460" y="370" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="560" y="395" font-weight="700" fill="#1e3a8a">stockage · 10.10.10.20</text>
    <text x="560" y="415" fill="#1e3a8a" font-size="12">NFS + iSCSI · 2e disque 10 Go</text>
  </g>
  <text x="895" y="300" text-anchor="middle" font-size="13" fill="#475569">Parties 6 et 7 :</text>
  <text x="895" y="318" text-anchor="middle" font-size="13" fill="#475569">web1 et stockage</text>
  <text x="895" y="336" text-anchor="middle" font-size="13" fill="#475569">sortent sur Internet</text>
  <text x="895" y="354" text-anchor="middle" font-size="13" fill="#475569">par le routeur.</text>
</svg>
