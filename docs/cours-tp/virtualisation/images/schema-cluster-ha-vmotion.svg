<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Un cluster de virtualisation : migration à chaud et haute disponibilité</title>
  <desc id="d">Trois hôtes de type 1 forment un cluster, administré par une console centrale comme vCenter. Leurs VM sont stockées sur un stockage partagé auquel tous les hôtes accèdent. La migration à chaud déplace une VM allumée de l'hôte 1 vers l'hôte 2 sans coupure, par exemple avant une maintenance. Si l'hôte 3 tombe en panne, la haute disponibilité redémarre automatiquement ses VM sur les hôtes restants, le temps d'un redémarrage.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/>
  <rect x="330" y="20" width="340" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">Console centrale (ex. vCenter)</text>
  <line x1="500" y1="64" x2="500" y2="90" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="160" y1="90" x2="840" y2="90" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-size="14" text-anchor="middle">
    <!-- hôte 1 -->
    <line x1="160" y1="90" x2="160" y2="110" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="50" y="110" width="220" height="190" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="160" y="135" font-weight="700" fill="#0f172a">Hôte 1</text>
    <rect x="70" y="150" width="80" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="177" fill="#1e3a8a">VM A</text>
    <rect x="170" y="150" width="80" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="177" fill="#1e3a8a">VM B</text>
    <rect x="70" y="250" width="180" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="160" y="272" fill="#78350f">hyperviseur type 1</text>
    <!-- hôte 2 -->
    <line x1="500" y1="90" x2="500" y2="110" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="390" y="110" width="220" height="190" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="500" y="135" font-weight="700" fill="#0f172a">Hôte 2</text>
    <rect x="410" y="150" width="80" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="177" fill="#1e3a8a">VM C</text>
    <rect x="510" y="150" width="80" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="550" y="177" fill="#2563eb">VM B</text>
    <rect x="410" y="200" width="80" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="450" y="225" fill="#dc2626">VM E</text>
    <rect x="410" y="250" width="180" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="500" y="272" fill="#78350f">hyperviseur type 1</text>
    <!-- hôte 3 en panne -->
    <line x1="840" y1="90" x2="840" y2="110" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="730" y="110" width="220" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="840" y="135" font-weight="700" fill="#991b1b">Hôte 3 : panne ✘</text>
    <rect x="750" y="150" width="80" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="790" y="177" fill="#991b1b">VM D</text>
    <rect x="850" y="150" width="80" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="890" y="177" fill="#991b1b">VM E</text>
    <rect x="750" y="250" width="180" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="840" y="272" fill="#991b1b">hyperviseur arrêté</text>
  </g>
  <!-- flèches -->
  <path d="M250 165 C 330 120, 430 120, 505 165" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#fl)"/>
  <text x="380" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">migration à chaud : sans coupure</text>
  <path d="M850 195 C 760 245, 620 250, 495 225" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#flr)"/>
  <text x="690" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">haute disponibilité :</text>
  <text x="690" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">redémarrage automatique</text>
  <!-- stockage partagé -->
  <rect x="200" y="370" width="600" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="397" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Stockage partagé (SAN ou NAS)</text>
  <text x="500" y="418" text-anchor="middle" font-size="13" fill="#166534">les disques de TOUTES les VM, visibles par tous les hôtes</text>
  <line x1="160" y1="300" x2="300" y2="370" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="500" y1="300" x2="500" y2="370" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="840" y1="300" x2="700" y2="370" stroke="#16a34a" stroke-width="2.5"/>
</svg>
