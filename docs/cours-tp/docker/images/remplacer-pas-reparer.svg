<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Mettre à jour, c'est remplacer le conteneur : nouvelle image, mêmes données</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#607d8b"/></marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="160" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Avant</text>
  <text x="800" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Après la mise à jour</text>

  <rect x="50" y="52" width="220" height="56" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="160" y="76" text-anchor="middle" font-weight="bold">image</text>
  <text x="160" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#263238">nginx:1.30</text>
  <rect x="690" y="52" width="220" height="56" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" font-weight="bold">nouvelle image</text>
  <text x="800" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#263238">nginx:1.31</text>

  <line x1="160" y1="108" x2="160" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="800" y1="108" x2="800" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>

  <rect x="50" y="142" width="220" height="76" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="160" y="168" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur web-maj</text>
  <text x="160" y="190" text-anchor="middle" font-size="12">nginx/1.30.8</text>
  <text x="160" y="208" text-anchor="middle" font-size="11" fill="#b71c1c">supprimé, pas réparé</text>
  <rect x="690" y="142" width="220" height="76" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="800" y="168" text-anchor="middle" font-weight="bold" fill="#01579b">nouveau conteneur web-maj</text>
  <text x="800" y="190" text-anchor="middle" font-size="12">nginx/1.31.10</text>
  <text x="800" y="208" text-anchor="middle" font-size="11" fill="#2e7d32">créé à neuf</text>

  <rect x="310" y="128" width="340" height="104" rx="10" fill="#f4f6f8" stroke="#607d8b" stroke-width="2"/>
  <text x="480" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">la mise à jour, en trois commandes</text>
  <text x="326" y="172" font-family="Consolas, monospace" font-size="11" fill="#263238">docker pull nginx:1.31</text>
  <text x="326" y="192" font-family="Consolas, monospace" font-size="11" fill="#263238">docker rm -f web-maj</text>
  <text x="326" y="212" font-family="Consolas, monospace" font-size="10" fill="#263238">docker run -d --name web-maj -p 8088:80 nginx:1.31</text>
  <line x1="270" y1="180" x2="308" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="650" y1="180" x2="688" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>

  <line x1="690" y1="256" x2="272" y2="256" stroke="#607d8b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="480" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#455a64">retour arrière : recréer le conteneur</text>
  <text x="480" y="276" text-anchor="middle" font-size="12" fill="#455a64">avec l'ancienne étiquette nginx:1.30</text>

  <line x1="160" y1="218" x2="160" y2="318" stroke="#2e7d32" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="800" y1="218" x2="800" y2="318" stroke="#2e7d32" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="50" y="320" width="860" height="52" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="480" y="344" text-anchor="middle" font-weight="bold" fill="#1b5e20">le volume : les données ne bougent pas</text>
  <text x="480" y="362" text-anchor="middle" font-size="12">pour une application qui a des données : elles sont dans le volume, pas dans le conteneur</text>

  <rect x="50" y="392" width="860" height="44" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="480" y="411" text-anchor="middle" font-size="12" fill="#263238">Les deux images restent sur la VM. Avec une base de données (Nextcloud, WordPress…), le retour arrière demande aussi</text>
  <text x="480" y="428" text-anchor="middle" font-size="12" fill="#263238">la sauvegarde des volumes faite avant la mise à jour : la nouvelle version migre souvent les données au démarrage.</text>
</svg>
