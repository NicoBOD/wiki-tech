<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Du Dockerfile au conteneur, en passant par un registre</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
  <g transform="translate(0,30)">
  <rect x="10" y="20" width="600" height="190" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="25" y="45" font-weight="bold" fill="#1b5e20">VM docker-hote</text>
  <rect x="25" y="65" width="160" height="110" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="105" y="88" text-anchor="middle" font-weight="bold">dossier du projet</text>
  <text x="105" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="12">Dockerfile</text>
  <text x="105" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="12">index.html</text>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="#546e7a">= le contexte</text>
  <rect x="235" y="75" width="140" height="90" rx="10" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="305" y="105" text-anchor="middle" font-weight="bold">image</text>
  <text x="305" y="127" text-anchor="middle" font-size="12">web</text>
  <text x="305" y="148" text-anchor="middle" font-size="11" fill="#546e7a">en lecture seule</text>
  <rect x="440" y="75" width="150" height="90" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="515" y="105" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur</text>
  <text x="515" y="127" text-anchor="middle" font-size="12">apache</text>
  <text x="515" y="148" text-anchor="middle" font-size="11" fill="#546e7a">port 8080 → 80</text>
  <line x1="185" y1="120" x2="233" y2="120" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="210" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="12">docker build</text>
  <line x1="375" y1="120" x2="438" y2="120" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="407" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="12">docker run</text>
  <rect x="650" y="20" width="240" height="190" rx="12" fill="#f4f6f8" stroke="#6d4c41" stroke-width="2"/>
  <text x="770" y="182" text-anchor="middle" font-weight="bold" fill="#4e342e">Registre</text>
  <text x="770" y="200" text-anchor="middle" font-size="12" fill="#546e7a">Docker Hub ou registre privé</text>
  <rect x="680" y="85" width="180" height="70" rx="10" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="770" y="113" text-anchor="middle" font-weight="bold">image étiquetée</text>
  <text x="770" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="11">registre/web:1.0</text>
  <path d="M305,75 C305,-25 770,-25 770,83" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="540" y="-14" text-anchor="middle" font-family="Consolas, monospace" font-size="12">docker tag + docker push</text>
  <rect x="650" y="230" width="240" height="60" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="257" text-anchor="middle" font-weight="bold" fill="#1b5e20">autres machines</text>
  <text x="770" y="277" text-anchor="middle" font-size="12">cluster Swarm, collègues…</text>
  <line x1="770" y1="210" x2="770" y2="228" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="780" y="224" font-family="Consolas, monospace" font-size="12">docker pull</text>
  </g>
</svg>
