<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Un reverse proxy devant plusieurs conteneurs</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
  <rect x="10" y="120" width="190" height="160" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="105" y="148" text-anchor="middle" font-weight="bold">🌐 Navigateur du PC</text>
  <text x="105" y="180" text-anchor="middle" font-size="12">portainer.docker.test</text>
  <text x="105" y="202" text-anchor="middle" font-size="12">nextcloud.docker.test</text>
  <text x="105" y="224" text-anchor="middle" font-size="12">apache-interne.docker.test</text>
  <text x="105" y="258" text-anchor="middle" font-size="11" fill="#546e7a">fichier hosts → IP de la VM</text>
  <rect x="240" y="20" width="650" height="370" rx="14" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="260" y="46" font-size="16" font-weight="bold" fill="#1b5e20">VM docker-hote</text>
  <rect x="270" y="150" width="190" height="100" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="365" y="180" text-anchor="middle" font-weight="bold">Nginx Proxy Manager</text>
  <text x="365" y="204" text-anchor="middle" font-size="12">ports 80, 443 (et 81 :</text>
  <text x="365" y="222" text-anchor="middle" font-size="12">administration)</text>
  <text x="365" y="240" text-anchor="middle" font-size="11" fill="#546e7a">lit le nom demandé</text>
  <line x1="200" y1="200" x2="268" y2="200" stroke="#1565c0" stroke-width="3" marker-end="url(#m)"/>
  <rect x="660" y="60" width="200" height="70" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="760" y="88" text-anchor="middle" font-weight="bold" fill="#01579b">portainer</text>
  <text x="760" y="110" text-anchor="middle" font-size="12">port 9000, non publié</text>
  <rect x="660" y="165" width="200" height="70" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="760" y="193" text-anchor="middle" font-weight="bold" fill="#01579b">nextcloud</text>
  <text x="760" y="215" text-anchor="middle" font-size="12">port 80, non publié</text>
  <rect x="660" y="270" width="200" height="70" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="760" y="298" text-anchor="middle" font-weight="bold" fill="#01579b">test-apache-interne</text>
  <text x="760" y="320" text-anchor="middle" font-size="12">port 80, non publié</text>
  <line x1="460" y1="180" x2="658" y2="95" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="460" y1="200" x2="658" y2="200" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="460" y1="220" x2="658" y2="305" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <text x="555" y="118" text-anchor="middle" font-size="11" fill="#5e35b1">portainer_network</text>
  <text x="555" y="192" text-anchor="middle" font-size="11" fill="#5e35b1">nextcloud-proxy_app</text>
  <text x="555" y="290" text-anchor="middle" font-size="11" fill="#5e35b1">npm_default</text>
  <text x="565" y="372" text-anchor="middle" font-size="12" fill="#546e7a">un réseau Docker par application, sur lequel NPM est branché</text>
</svg>
