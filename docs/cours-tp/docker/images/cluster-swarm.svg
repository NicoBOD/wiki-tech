<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Le cluster Swarm du lab : un manager, deux workers, le maillage de routage</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
  <rect x="330" y="10" width="240" height="50" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="450" y="32" text-anchor="middle" font-weight="bold">🌐 Navigateur ou curl</text>
  <text x="450" y="50" text-anchor="middle" font-size="12">http://IP-de-n'importe-quel-nœud:8080</text>
  <line x1="390" y1="60" x2="150" y2="108" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <line x1="450" y1="60" x2="450" y2="108" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <line x1="510" y1="60" x2="750" y2="108" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <rect x="20" y="110" width="260" height="190" rx="12" fill="#f4f6f8" stroke="#c62828" stroke-width="2"/>
  <text x="35" y="135" font-weight="bold" fill="#b71c1c">docker-hote — manager</text>
  <text x="35" y="155" font-size="12" fill="#546e7a">192.168.8.71 · 2 vCPU · 4 Go</text>
  <text x="35" y="175" font-size="12">garde l'état du cluster, donne les</text>
  <text x="35" y="190" font-size="12">ordres aux workers (port 2377)</text>
  <rect x="320" y="110" width="260" height="190" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="335" y="135" font-weight="bold" fill="#1b5e20">docker-n2 — worker</text>
  <text x="335" y="155" font-size="12" fill="#546e7a">192.168.8.73 · 1 vCPU · 1 Go</text>
  <text x="335" y="175" font-size="12">exécute les tâches reçues</text>
  <rect x="620" y="110" width="260" height="190" rx="12" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="635" y="135" font-weight="bold" fill="#1b5e20">docker-n3 — worker</text>
  <text x="635" y="155" font-size="12" fill="#546e7a">192.168.8.74 · 1 vCPU · 1 Go</text>
  <text x="635" y="175" font-size="12">exécute les tâches reçues</text>
  <rect x="60" y="205" width="180" height="60" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="150" y="230" text-anchor="middle" font-weight="bold" fill="#01579b">bonjour.3</text>
  <text x="150" y="250" text-anchor="middle" font-size="12">réplique (tâche)</text>
  <rect x="360" y="205" width="180" height="60" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="450" y="230" text-anchor="middle" font-weight="bold" fill="#01579b">bonjour.1</text>
  <text x="450" y="250" text-anchor="middle" font-size="12">réplique (tâche)</text>
  <rect x="660" y="205" width="180" height="60" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="750" y="230" text-anchor="middle" font-weight="bold" fill="#01579b">bonjour.2</text>
  <text x="750" y="250" text-anchor="middle" font-size="12">réplique (tâche)</text>
  <rect x="20" y="315" width="860" height="55" rx="10" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="450" y="337" text-anchor="middle" font-weight="bold" fill="#4527a0">réseau overlay « ingress » (maillage de routage, VXLAN sur UDP 4789)</text>
  <text x="450" y="358" text-anchor="middle" font-size="12">chaque nœud accepte le port 8080 et transmet la requête à une réplique, sur n'importe quel nœud</text>
  <line x1="150" y1="265" x2="150" y2="313" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="450" y1="265" x2="450" y2="313" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="750" y1="265" x2="750" y2="313" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
