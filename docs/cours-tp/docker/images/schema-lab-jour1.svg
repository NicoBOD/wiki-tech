<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Lab du jour 1 : le PC, la VM docker-hote et ses conteneurs</title>
  <rect x="10" y="10" width="840" height="400" rx="14" fill="#f4f6f8" stroke="#90a4ae" stroke-width="2"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#263238">PC hôte (Windows)</text>
  <!-- Navigateur et terminal -->
  <rect x="30" y="70" width="210" height="120" rx="10" fill="#ffffff" stroke="#607d8b"/>
  <text x="45" y="98" font-weight="bold" fill="#263238">🌐 Navigateur web</text>
  <text x="45" y="122" fill="#37474f">http://IP-de-la-VM:8080</text>
  <text x="45" y="144" fill="#37474f">https://IP-de-la-VM:9443</text>
  <rect x="30" y="210" width="210" height="90" rx="10" fill="#ffffff" stroke="#607d8b"/>
  <text x="45" y="238" font-weight="bold" fill="#263238">Terminal (PowerShell)</text>
  <text x="45" y="262" fill="#37474f">ssh adminlab@IP-de-la-VM</text>
  <rect x="30" y="320" width="210" height="70" rx="10" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="45" y="348" font-weight="bold" fill="#0d47a1">Workstation ou</text>
  <text x="45" y="370" font-weight="bold" fill="#0d47a1">VirtualBox</text>
  <!-- Réseau virtuel -->
  <rect x="285" y="70" width="40" height="320" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="310" y="230" fill="#795548" transform="rotate(-90 310 230)" text-anchor="middle">Réseau virtuel (NAT ou privé hôte)</text>
  <line x1="240" y1="130" x2="285" y2="130" stroke="#607d8b" stroke-width="2"/>
  <line x1="240" y1="255" x2="285" y2="255" stroke="#607d8b" stroke-width="2"/>
  <line x1="325" y1="200" x2="370" y2="200" stroke="#607d8b" stroke-width="2"/>
  <!-- VM -->
  <rect x="370" y="60" width="460" height="330" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="390" y="88" font-size="16" font-weight="bold" fill="#1b5e20">VM docker-hote — Debian 13</text>
  <text x="390" y="110" fill="#37474f">2 vCPU · 4 Go · disque de 40 Go</text>
  <rect x="390" y="300" width="420" height="70" rx="8" fill="#e8f5e9" stroke="#43a047"/>
  <text x="600" y="330" text-anchor="middle" font-weight="bold" fill="#1b5e20">Docker Engine (service dockerd)</text>
  <text x="600" y="352" text-anchor="middle" fill="#2e7d32">un seul noyau Linux, partagé par tous les conteneurs</text>
  <rect x="390" y="130" width="130" height="150" rx="8" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="455" y="158" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur</text>
  <text x="455" y="182" text-anchor="middle" fill="#01579b">web (nginx)</text>
  <text x="455" y="206" text-anchor="middle" font-size="12" fill="#546e7a">partie 2</text>
  <text x="455" y="230" text-anchor="middle" fill="#37474f">port 80</text>
  <text x="455" y="252" text-anchor="middle" fill="#37474f">← 8080 de la VM</text>
  <rect x="535" y="130" width="130" height="150" rx="8" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="600" y="158" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur</text>
  <text x="600" y="182" text-anchor="middle" fill="#01579b">debian</text>
  <text x="600" y="206" text-anchor="middle" fill="#01579b">(Apache + SSH)</text>
  <text x="600" y="274" text-anchor="middle" font-size="12" fill="#546e7a">partie 3</text>
  <text x="600" y="230" text-anchor="middle" fill="#37474f">ports 80 et 22</text>
  <text x="600" y="252" text-anchor="middle" fill="#37474f">← 8080 et 2222</text>
  <rect x="680" y="130" width="130" height="150" rx="8" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="745" y="158" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur</text>
  <text x="745" y="182" text-anchor="middle" fill="#01579b">portainer</text>
  <text x="745" y="206" text-anchor="middle" font-size="12" fill="#546e7a">partie 4</text>
  <text x="745" y="230" text-anchor="middle" fill="#37474f">port 9443</text>
  <text x="745" y="252" text-anchor="middle" fill="#37474f">← 9443</text>
</svg>
