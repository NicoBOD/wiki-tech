<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>L'application Nextcloud décrite par Docker Compose</title>
  <rect x="10" y="10" width="860" height="380" rx="14" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="30" y="40" font-size="17" font-weight="bold" fill="#1b5e20">VM docker-hote — projet Compose « nextcloud »</text>
  <rect x="330" y="60" width="220" height="40" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="440" y="86" text-anchor="middle" font-weight="bold">port 80 de la VM</text>
  <rect x="330" y="140" width="220" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="440" y="170" text-anchor="middle" font-weight="bold" fill="#01579b">nc — Nextcloud</text>
  <text x="440" y="194" text-anchor="middle" font-size="12">nextcloud:apache</text>
  <line x1="440" y1="100" x2="440" y2="140" stroke="#1565c0" stroke-width="3"/>
  <rect x="610" y="150" width="200" height="60" rx="10" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="710" y="176" text-anchor="middle" font-weight="bold">volume nc_data</text>
  <text x="710" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="11">/var/www/html</text>
  <line x1="550" y1="180" x2="610" y2="180" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- réseaux -->
  <rect x="60" y="250" width="330" height="36" rx="8" fill="#e8f5e9" stroke="#43a047"/>
  <text x="225" y="273" text-anchor="middle" font-weight="bold">réseau redisnet</text>
  <rect x="490" y="250" width="330" height="36" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="655" y="273" text-anchor="middle" font-weight="bold">réseau dbnet</text>
  <line x1="400" y1="220" x2="300" y2="250" stroke="#43a047" stroke-width="3"/>
  <line x1="480" y1="220" x2="580" y2="250" stroke="#5e35b1" stroke-width="3"/>
  <rect x="120" y="310" width="210" height="64" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="225" y="337" text-anchor="middle" font-weight="bold" fill="#01579b">redis — cache</text>
  <text x="225" y="358" text-anchor="middle" font-size="12">redis:alpine · 6379 (non publié)</text>
  <line x1="225" y1="286" x2="225" y2="310" stroke="#43a047" stroke-width="3"/>
  <rect x="490" y="310" width="210" height="64" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="595" y="337" text-anchor="middle" font-weight="bold" fill="#01579b">db — MariaDB</text>
  <text x="595" y="358" text-anchor="middle" font-size="12">mariadb:11.8 · 3306 (non publié)</text>
  <line x1="595" y1="286" x2="595" y2="310" stroke="#5e35b1" stroke-width="3"/>
  <rect x="720" y="314" width="130" height="56" rx="10" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="785" y="338" text-anchor="middle" font-weight="bold">volume db_data</text>
  <text x="785" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="10">/var/lib/mysql</text>
  <line x1="700" y1="342" x2="720" y2="342" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 3"/>
</svg>
