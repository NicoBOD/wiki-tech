<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Volume, dossier monté et tmpfs</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
  <rect x="10" y="10" width="860" height="340" rx="14" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="30" y="40" font-size="17" font-weight="bold" fill="#1b5e20">VM docker-hote</text>
  <!-- conteneurs -->
  <rect x="40" y="70" width="240" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="160" y="100" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur bdd</text>
  <text x="160" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13">/var/lib/mysql</text>
  <rect x="320" y="70" width="240" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="440" y="100" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur site</text>
  <text x="440" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13">/usr/share/nginx/html</text>
  <rect x="600" y="70" width="240" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="720" y="100" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur cache</text>
  <text x="720" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13">/cache</text>
  <!-- stockages -->
  <rect x="40" y="220" width="240" height="100" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="160" y="248" text-anchor="middle" font-weight="bold">Volume nommé</text>
  <text x="160" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="12">/var/lib/docker/volumes/</text>
  <text x="160" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="12">donnees-bdd/_data</text>
  <text x="160" y="310" text-anchor="middle" font-size="12" fill="#546e7a">géré par Docker</text>
  <rect x="320" y="220" width="240" height="100" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="440" y="248" text-anchor="middle" font-weight="bold">Dossier monté</text>
  <text x="440" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="12">/home/tssr/site</text>
  <text x="440" y="292" text-anchor="middle" font-size="12" fill="#546e7a">dossier choisi de la VM,</text>
  <text x="440" y="310" text-anchor="middle" font-size="12" fill="#546e7a">modifiable depuis la VM</text>
  <rect x="600" y="220" width="240" height="100" rx="10" fill="#fce4ec" stroke="#d81b60"/>
  <text x="720" y="248" text-anchor="middle" font-weight="bold">tmpfs</text>
  <text x="720" y="272" text-anchor="middle" font-size="12">mémoire vive</text>
  <text x="720" y="292" text-anchor="middle" font-size="12" fill="#546e7a">effacé à l'arrêt</text>
  <text x="720" y="310" text-anchor="middle" font-size="12" fill="#546e7a">du conteneur</text>
  <line x1="160" y1="150" x2="160" y2="218" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="170" y="190" font-family="Consolas, monospace" font-size="12">-v donnees-bdd:/var/lib/mysql</text>
  <line x1="440" y1="150" x2="440" y2="218" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="450" y="190" font-family="Consolas, monospace" font-size="12">-v ~/site:/usr/…:ro</text>
  <line x1="720" y1="150" x2="720" y2="218" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="730" y="190" font-family="Consolas, monospace" font-size="12">--tmpfs /cache</text>
</svg>
