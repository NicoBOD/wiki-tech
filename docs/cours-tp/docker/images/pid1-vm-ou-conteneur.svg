<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Le processus numéro 1 : systemd dans une VM, bash dans le conteneur debian</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- Panneau VM -->
  <rect x="20" y="15" width="450" height="470" rx="14" fill="#f4f6f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="245" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Une machine virtuelle</text>
  <text x="245" y="70" text-anchor="middle" font-size="12" fill="#546e7a">au démarrage, le noyau lance le processus numéro 1</text>
  <rect x="155" y="88" width="180" height="44" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="245" y="116" text-anchor="middle" font-weight="bold">PID 1 : systemd</text>
  <line x1="215" y1="132" x2="160" y2="166" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <line x1="275" y1="132" x2="330" y2="166" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <rect x="85" y="168" width="150" height="54" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="160" y="192" text-anchor="middle" font-weight="bold" fill="#01579b">apache2</text>
  <text x="160" y="210" text-anchor="middle" font-size="11" fill="#546e7a">démarré par systemd</text>
  <rect x="255" y="168" width="150" height="54" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="330" y="192" text-anchor="middle" font-weight="bold" fill="#01579b">sshd</text>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#546e7a">démarré par systemd</text>
  <text x="245" y="244" text-anchor="middle" font-size="12" fill="#263238">systemd démarre tous les services activés</text>

  <line x1="245" y1="258" x2="245" y2="300" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="257" y="284" font-size="12" font-weight="bold" fill="#263238">redémarrage de la VM</text>

  <rect x="155" y="312" width="180" height="44" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="245" y="340" text-anchor="middle" font-weight="bold">PID 1 : systemd</text>
  <line x1="215" y1="356" x2="160" y2="388" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <line x1="275" y1="356" x2="330" y2="388" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <rect x="85" y="390" width="150" height="54" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="160" y="414" text-anchor="middle" font-weight="bold" fill="#01579b">apache2</text>
  <text x="160" y="432" text-anchor="middle" font-size="11" fill="#2e7d32">de retour</text>
  <rect x="255" y="390" width="150" height="54" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="330" y="414" text-anchor="middle" font-weight="bold" fill="#01579b">sshd</text>
  <text x="330" y="432" text-anchor="middle" font-size="11" fill="#2e7d32">de retour</text>
  <text x="245" y="468" text-anchor="middle" font-size="12" fill="#263238">les services reviennent tout seuls</text>

  <!-- Panneau conteneur -->
  <rect x="490" y="15" width="450" height="470" rx="14" fill="#f4f6f8" stroke="#0288d1" stroke-width="2"/>
  <text x="715" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#01579b">Le conteneur debian</text>
  <text x="715" y="70" text-anchor="middle" font-size="12" fill="#546e7a">Docker lance un seul programme, celui de l'image</text>
  <rect x="625" y="88" width="180" height="44" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="715" y="116" text-anchor="middle" font-weight="bold">PID 1 : bash</text>
  <line x1="685" y1="132" x2="630" y2="166" stroke="#455a64" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m)"/>
  <line x1="745" y1="132" x2="800" y2="166" stroke="#455a64" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m)"/>
  <rect x="555" y="168" width="150" height="54" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="630" y="190" text-anchor="middle" font-weight="bold" fill="#01579b">apache2</text>
  <text x="630" y="209" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">service apache2 start</text>
  <rect x="725" y="168" width="150" height="54" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="190" text-anchor="middle" font-weight="bold" fill="#01579b">sshd</text>
  <text x="800" y="209" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">service ssh start</text>
  <text x="715" y="244" text-anchor="middle" font-size="12" fill="#263238">lancés à la main : ils disparaissent avec l'ancien processus</text>

  <line x1="715" y1="258" x2="715" y2="300" stroke="#455a64" stroke-width="2" marker-end="url(#m)"/>
  <text x="727" y="284" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#263238">docker restart debian</text>

  <rect x="625" y="312" width="180" height="44" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="715" y="340" text-anchor="middle" font-weight="bold">PID 1 : bash</text>
  <rect x="555" y="390" width="150" height="54" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="630" y="414" text-anchor="middle" font-weight="bold" fill="#b71c1c" text-decoration="line-through">apache2</text>
  <text x="630" y="432" text-anchor="middle" font-size="11" fill="#b71c1c">is not running</text>
  <rect x="725" y="390" width="150" height="54" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="414" text-anchor="middle" font-weight="bold" fill="#b71c1c" text-decoration="line-through">sshd</text>
  <text x="800" y="432" text-anchor="middle" font-size="11" fill="#b71c1c">is not running</text>
  <text x="715" y="468" text-anchor="middle" font-size="12" fill="#263238">Docker relance bash, et seulement bash</text>
  <text x="715" y="381" text-anchor="middle" font-size="11" fill="#546e7a">le port 8080 reste publié, mais personne n'écoute</text>
</svg>
