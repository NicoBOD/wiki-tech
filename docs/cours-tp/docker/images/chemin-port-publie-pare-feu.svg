<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Un port publié contourne UFW : le paquet est redirigé avant la chaîne INPUT</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#263238">Le chemin d'un paquet vers un port publié</text>
  <text x="940" y="30" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#263238">docker run -p <tspan fill="#f57f17" font-weight="bold">8080</tspan>:<tspan fill="#0277bd" font-weight="bold">80</tspan> …</text>

  <rect x="20" y="62" width="150" height="86" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-weight="bold">paquet entrant</text>
  <text x="95" y="112" text-anchor="middle" font-size="12">destiné au port 8080</text>
  <text x="95" y="130" text-anchor="middle" font-size="12">de la VM</text>

  <rect x="205" y="62" width="150" height="86" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="280" y="90" text-anchor="middle" font-weight="bold">table nat</text>
  <text x="280" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#263238">PREROUTING</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#546e7a">dès l'arrivée</text>

  <rect x="390" y="62" width="210" height="86" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="495" y="88" text-anchor="middle" font-weight="bold">chaîne <tspan font-family="Consolas, monospace">DOCKER</tspan></text>
  <text x="495" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">DNAT</text>
  <text x="495" y="126" text-anchor="middle" font-size="12">8080 devient</text>
  <text x="495" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#263238">IP-du-conteneur:80</text>

  <rect x="635" y="62" width="135" height="86" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="702" y="94" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold" font-size="14" fill="#1b5e20">FORWARD</text>
  <text x="702" y="116" text-anchor="middle" font-size="12">le paquet est</text>
  <text x="702" y="132" text-anchor="middle" font-size="12"><tspan font-weight="bold">routé</tspan>, pas reçu</text>

  <rect x="805" y="62" width="135" height="86" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="872" y="90" text-anchor="middle" font-weight="bold" fill="#01579b">conteneur</text>
  <text x="872" y="112" text-anchor="middle" font-size="12">nginx écoute sur</text>
  <text x="872" y="130" text-anchor="middle" font-size="12">le port 80</text>

  <line x1="170" y1="105" x2="203" y2="105" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="355" y1="105" x2="388" y2="105" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="600" y1="105" x2="633" y2="105" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>
  <line x1="770" y1="105" x2="803" y2="105" stroke="#1565c0" stroke-width="2" marker-end="url(#m)"/>

  <rect x="620" y="170" width="165" height="46" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-dasharray="6 4"/>
  <text x="702" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#4527a0">DOCKER-USER</text>
  <text x="702" y="206" text-anchor="middle" font-size="11" fill="#263238">règles de l'administrateur</text>
  <line x1="702" y1="150" x2="702" y2="168" stroke="#5e35b1" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- branche vers INPUT -->
  <line x1="280" y1="150" x2="280" y2="296" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="290" y="200" font-size="12" fill="#546e7a">un paquet pour la VM elle-même</text>
  <text x="290" y="217" font-size="12" fill="#546e7a">continue vers la chaîne INPUT</text>
  <line x1="495" y1="150" x2="495" y2="262" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="485" y1="252" x2="505" y2="272" stroke="#c62828" stroke-width="3"/>
  <line x1="505" y1="252" x2="485" y2="272" stroke="#c62828" stroke-width="3"/>
  <text x="515" y="250" font-size="12" font-weight="bold" fill="#b71c1c">jamais ici : le paquet est déjà redirigé</text>

  <rect x="20" y="300" width="540" height="100" rx="12" fill="#f4f6f8" stroke="#c62828" stroke-width="2"/>
  <text x="40" y="326" font-size="15" font-weight="bold" fill="#b71c1c">chaîne <tspan font-family="Consolas, monospace">INPUT</tspan> : les règles qui protègent la VM</text>
  <text x="40" y="350" font-size="13" fill="#263238">C'est là qu'agit le pare-feu de la machine (UFW, firewalld).</text>
  <text x="40" y="374" font-size="13" fill="#263238">Exemple : <tspan font-family="Consolas, monospace" font-weight="bold">ufw deny 8080</tspan></text>

  <rect x="590" y="300" width="350" height="100" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="608" y="326" font-size="14" font-weight="bold" fill="#b71c1c">Résultat : UFW ne protège pas un port publié</text>
  <text x="608" y="348" font-size="12" fill="#263238">Le port 8080 reste joignable depuis l'extérieur :</text>
  <text x="608" y="366" font-size="12" fill="#263238">le paquet a été routé vers le conteneur sans</text>
  <text x="608" y="384" font-size="12" fill="#263238">jamais passer par les règles d'UFW.</text>

  <rect x="20" y="420" width="920" height="104" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="40" y="446" font-size="15" font-weight="bold" fill="#1b5e20">Les bonnes pratiques</text>
  <text x="40" y="468" font-size="13" fill="#263238">• ne publier que les ports nécessaires, et les limiter à une adresse : <tspan font-family="Consolas, monospace" font-size="12">-p 127.0.0.1:8085:80</tspan></text>
  <text x="40" y="488" font-size="13" fill="#263238">• mettre les services derrière un reverse proxy, qui seul publie les ports 80 et 443</text>
  <text x="40" y="508" font-size="13" fill="#263238">• filtrer dans la chaîne <tspan font-family="Consolas, monospace" font-size="12">DOCKER-USER</tspan> · protéger le serveur par un pare-feu réseau en amont (pfSense, OPNsense…)</text>
</svg>
