<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Principe de la bascule CARP</title>
  <desc id="d">À gauche, en fonctionnement normal, le pare-feu primaire est MASTER : il possède l'adresse IP virtuelle et envoie une annonce CARP chaque seconde ; le secondaire est BACKUP et écoute. À droite, quand le primaire tombe en panne, les annonces s'arrêtent ; après environ trois secondes le secondaire devient MASTER, prend l'adresse IP virtuelle et prévient le réseau. Les postes clients continuent d'utiliser la même passerelle 192.168.19.21.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="16" fill="#ffffff"/>

  <!-- Panneau 1 -->
  <rect x="16" y="16" width="452" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="242" y="46" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">① Fonctionnement normal</text>

  <rect x="40" y="76" width="160" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="120" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">pfsense-19</text>
  <text x="120" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">MASTER</text>
  <text x="120" y="148" text-anchor="middle" font-size="12" fill="#166534">possède la VIP .21</text>
  <text x="120" y="164" text-anchor="middle" font-size="11.5" fill="#4b5563">skew 0</text>

  <rect x="284" y="76" width="160" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="364" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#1e293b">pfsense-20</text>
  <text x="364" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">BACKUP</text>
  <text x="364" y="148" text-anchor="middle" font-size="12" fill="#475569">écoute, attend</text>
  <text x="364" y="164" text-anchor="middle" font-size="11.5" fill="#4b5563">skew 100</text>

  <line x1="202" y1="112" x2="280" y2="112" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="241" y="196" text-anchor="middle" font-size="12" fill="#1d4ed8">annonce CARP toutes les ~1 s</text>
  <text x="241" y="212" text-anchor="middle" font-size="11.5" fill="#1d4ed8">(IP proto 112, multicast 224.0.0.18)</text>

  <line x1="40" y1="300" x2="444" y2="300" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text x="242" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">LAN 192.168.19.0/24</text>
  <line x1="120" y1="172" x2="120" y2="300" stroke="#16a34a" stroke-width="3"/>
  <line x1="364" y1="172" x2="364" y2="300" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>

  <rect x="162" y="346" width="160" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="242" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Poste du LAN</text>
  <text x="242" y="390" text-anchor="middle" font-size="12" fill="#475569">passerelle 192.168.19.21</text>
  <line x1="242" y1="346" x2="242" y2="300" stroke="#64748b" stroke-width="2"/>
  <path d="M242,330 C200,320 150,320 128,304" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="242" y="436" text-anchor="middle" font-size="12" fill="#475569">le trafic passe par le MASTER</text>

  <!-- Panneau 2 -->
  <rect x="492" y="16" width="452" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="718" y="46" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">② Panne du primaire</text>

  <rect x="516" y="76" width="160" height="96" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="596" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">pfsense-19</text>
  <text x="596" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">HORS SERVICE</text>
  <text x="596" y="148" text-anchor="middle" font-size="12" fill="#7f1d1d">plus aucune annonce</text>

  <rect x="760" y="76" width="160" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="840" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">pfsense-20</text>
  <text x="840" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">MASTER</text>
  <text x="840" y="148" text-anchor="middle" font-size="12" fill="#166534">reprend la VIP .21</text>
  <text x="840" y="164" text-anchor="middle" font-size="11.5" fill="#4b5563">+ ARP gratuit</text>

  <text x="718" y="196" text-anchor="middle" font-size="12" fill="#b91c1c">silence pendant ≈ 3 × 1 s + 100/256 s ≈ 3,4 s</text>
  <text x="718" y="212" text-anchor="middle" font-size="11.5" fill="#b91c1c">→ le BACKUP se déclare MASTER</text>

  <line x1="516" y1="300" x2="920" y2="300" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text x="718" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">LAN 192.168.19.0/24</text>
  <line x1="596" y1="172" x2="596" y2="300" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="840" y1="172" x2="840" y2="300" stroke="#16a34a" stroke-width="3"/>

  <rect x="638" y="346" width="160" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="718" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Poste du LAN</text>
  <text x="718" y="390" text-anchor="middle" font-size="12" fill="#475569">passerelle 192.168.19.21</text>
  <line x1="718" y1="346" x2="718" y2="300" stroke="#64748b" stroke-width="2"/>
  <path d="M718,330 C760,320 810,320 832,304" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="718" y="436" text-anchor="middle" font-size="12" fill="#475569">aucune reconfiguration du poste</text>
</svg>
