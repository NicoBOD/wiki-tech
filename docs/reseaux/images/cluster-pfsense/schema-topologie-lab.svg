<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Topologie du lab : cluster de deux pare-feux pfSense</title>
  <desc id="d">Deux pare-feux pfSense, pfsense-19 (primaire) et pfsense-20 (secondaire), reliés au réseau WAN 192.168.8.0/24, au réseau LAN 192.168.19.0/24 et entre eux par un lien de synchronisation dédié 192.168.254.0/30. Les adresses IP virtuelles partagées sont 192.168.8.21 côté WAN et 192.168.19.21 côté LAN.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" rx="16" fill="#ffffff"/>

  <!-- Internet / hôte -->
  <g>
    <path d="M430,58 a26,22 0 0 1 40,-24 a32,26 0 0 1 58,4 a24,20 0 0 1 22,30 a20,18 0 0 1 -10,32 h-112 a22,20 0 0 1 2,-42 z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="490" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">Internet</text>
    <line x1="490" y1="104" x2="490" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="502" y="128" font-size="12.5" fill="#334155">NAT de l'hyperviseur — passerelle <tspan font-weight="700">192.168.8.2</tspan> (VMware) / <tspan font-weight="700">.1</tspan> (VirtualBox)</text>
  </g>

  <!-- Segment WAN -->
  <line x1="70" y1="160" x2="890" y2="160" stroke="#c48a00" stroke-width="6" stroke-linecap="round"/>
  <text x="70" y="148" font-size="14" font-weight="700" fill="#8a6100">WAN — VMnet8 (NAT) — 192.168.8.0/24</text>

  <!-- Segment LAN -->
  <line x1="70" y1="520" x2="890" y2="520" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <text x="70" y="550" font-size="14" font-weight="700" fill="#166534">LAN — VMnet19 (Host-only) — 192.168.19.0/24</text>

  <!-- VIP WAN -->
  <g>
    <line x1="480" y1="160" x2="480" y2="196" stroke="#c48a00" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="384" y="196" width="192" height="46" rx="10" fill="#fef3c7" stroke="#c48a00" stroke-width="2"/>
    <text x="480" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">VIP WAN (CARP, VHID 1)</text>
    <text x="480" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">192.168.8.21/24</text>
  </g>
  <!-- VIP LAN -->
  <g>
    <rect x="384" y="438" width="192" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">VIP LAN (CARP, VHID 2)</text>
    <text x="480" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">192.168.19.21/24</text>
    <line x1="480" y1="484" x2="480" y2="520" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  </g>

  <!-- Pare-feu primaire -->
  <g>
    <line x1="215" y1="160" x2="215" y2="262" stroke="#c48a00" stroke-width="3"/>
    <line x1="215" y1="420" x2="215" y2="520" stroke="#16a34a" stroke-width="3"/>
    <rect x="110" y="262" width="210" height="158" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="215" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#9a3412">pfsense-19</text>
    <text x="215" y="309" text-anchor="middle" font-size="13" fill="#9a3412">primaire — MASTER</text>
    <text x="126" y="338" font-size="12.5" fill="#1f2937"><tspan font-weight="700">em0</tspan> WAN  192.168.8.19/24</text>
    <text x="126" y="360" font-size="12.5" fill="#1f2937"><tspan font-weight="700">em1</tspan> LAN  192.168.19.19/24</text>
    <text x="126" y="382" font-size="12.5" fill="#1f2937"><tspan font-weight="700">em2</tspan> PFSYNC  192.168.254.1/30</text>
    <text x="126" y="406" font-size="11.5" fill="#6b7280">skew 0 (prioritaire)</text>
  </g>

  <!-- Pare-feu secondaire -->
  <g>
    <line x1="745" y1="160" x2="745" y2="262" stroke="#c48a00" stroke-width="3"/>
    <line x1="745" y1="420" x2="745" y2="520" stroke="#16a34a" stroke-width="3"/>
    <rect x="640" y="262" width="210" height="158" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="745" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#9a3412">pfsense-20</text>
    <text x="745" y="309" text-anchor="middle" font-size="13" fill="#9a3412">secondaire — BACKUP</text>
    <text x="656" y="338" font-size="12.5" fill="#1f2937"><tspan font-weight="700">em0</tspan> WAN  192.168.8.20/24</text>
    <text x="656" y="360" font-size="12.5" fill="#1f2937"><tspan font-weight="700">em1</tspan> LAN  192.168.19.20/24</text>
    <text x="656" y="382" font-size="12.5" fill="#1f2937"><tspan font-weight="700">em2</tspan> PFSYNC  192.168.254.2/30</text>
    <text x="656" y="406" font-size="11.5" fill="#6b7280">skew 100 (ajouté automatiquement)</text>
  </g>

  <!-- Lien de synchronisation -->
  <line x1="320" y1="372" x2="640" y2="372" stroke="#7c3aed" stroke-width="5"/>
  <rect x="352" y="300" width="256" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">LAN segment « SYNCHRO-PFSENSE »</text>
  <text x="480" y="340" text-anchor="middle" font-size="13" fill="#5b21b6">192.168.254.0/30 — XML-RPC + pfsync</text>
  <text x="480" y="394" text-anchor="middle" font-size="11.5" fill="#6b7280">lien dédié, uniquement entre les deux pare-feux</text>

  <!-- Hôte côté LAN -->
  <g>
    <line x1="480" y1="520" x2="480" y2="572" stroke="#16a34a" stroke-width="3"/>
    <rect x="300" y="572" width="360" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="480" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">PC hôte — carte virtuelle VMnet19 : 192.168.19.1</text>
    <text x="480" y="613" text-anchor="middle" font-size="12" fill="#475569">navigateur : https://192.168.19.19 / .20 / .21</text>
  </g>
</svg>
