site_name: Wiki Tech — NicoBOD
site_url: https://wiki.bodaine.fr/
site_description: Wiki technique personnel — systèmes, réseaux, cloud, cybersécurité, IA, automatisation
edit_uri: https://github.com/NicoBOD/wiki-tech/edit/main/docs/

# Fichiers présents dans docs/ mais exclus du site généré
# (non publiés, non indexés par la recherche, absents du sitemap)
exclude_docs: |
  _template.md
  !.well-known/

# Validation des liens au build. Couplé à `mkdocs build --strict` en CI,
# tout avertissement devient une erreur : on détecte les liens internes
# cassés, les ancres #section disparues et les liens absolus involontaires.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Page volontairement absente de la nav (accessible via le footer/copyright) :
# on l'exclut du contrôle omitted_files pour qu'il reste pertinent.
not_in_nav: |
  mentions-legales/index.md

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Suit la préférence système (clair/sombre) de l'utilisateur
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Passer en mode clair
    # Mode clair forcé
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    # Mode sombre forcé
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Revenir au thème système
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow

plugins:
  - search:
      lang: fr
      separator: '[\s\-,:!=\[\]()"/]+|(?<!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  # Métadonnées par dossier via .meta.yml (réduit la duplication)
  - meta
  - git-revision-date-localized:
      type: date
      locale: fr
      enable_creation_date: true
      fallback_to_build_date: true
  - social
  # Auto-héberge les ressources externes (images, polices) au build :
  # aucune requête vers des tiers, conformité RGPD, robustesse.
  - privacy
  # Zoom / lightbox au clic sur les images (captures d'écran)
  - glightbox
  - rss:
      match_path: "(systemes|reseaux|cloud|cybersecurite|ia|automatisation|logiciels|debug|astuces)/.*"
      date_from_meta:
        as_creation: date
      categories:
        - tags
  # Compresse PNG/JPG au build (pngquant + pillow), sources intactes
  - optimize
  - minify:
      minify_html: true
      htmlmin_opts:
        remove_comments: true

