site_name: Wiki Tech — NicoBOD
site_url: https://wiki.bodaine.fr/
site_description: Wiki technique personnel — systèmes, réseaux, cloud, cybersécurité, IA, automatisation
edit_uri: https://github.com/NicoBOD/wiki-tech/edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.follow

plugins:
  - search:
      lang: fr
      separator: '[\s\-,:!=\[\]()"/]+|(?<!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags:
      tags_file: tags.md

